    function dibujarTienda() {
      dibujarFondo(paletaDelMenu());

      pincel.textAlign = "center";
      pincel.textBaseline = "middle";

      pincel.font = "bold 28px " + FUENTE;
      textoConBorde("🛒  TIENDA", pantalla.width / 2, 36);

      pincel.font = "bold 17px " + FUENTE;
      textoConBorde("Tienes 🪙 " + monedas, pantalla.width / 2, 68, "#ffd60a");

      // Cada mejora se dibuja SOLA a partir de la lista MEJORAS
      for (let i = 0; i < MEJORAS.length; i++) {
        const m = MEJORAS[i];
        const caja = cajaFilaTienda(i);
        const nivel = mejoras[m.clave];
        const precio = precioDe(m);
        const alMaximo = (precio === null);
        const puedes = !alMaximo && monedas >= precio;
        const elegida = (i === filaTienda);

        pincel.fillStyle = elegida ? "rgba(255, 217, 61, 0.15)"
                                   : "rgba(8, 12, 30, 0.55)";
        rectRedondeado(caja.x, caja.y, caja.w, caja.h, 12);
        pincel.fill();
        pincel.strokeStyle = elegida ? "#ffd93d" : "rgba(255, 255, 255, 0.18)";
        pincel.lineWidth = elegida ? 2.5 : 1.5;
        pincel.stroke();

        pincel.textAlign = "left";
        pincel.textBaseline = "middle";

        pincel.font = "22px serif";
        pincel.fillStyle = "white";
        pincel.fillText(m.icono, caja.x + 12, caja.y + 27);

        pincel.font = "bold 15px " + FUENTE;
        textoConBorde(m.nombre, caja.x + 48, caja.y + 15);

        pincel.font = "11px " + FUENTE;
        textoConBorde(m.efecto, caja.x + 48, caja.y + 31, "#c3d0ea");

        // Los niveles, como bolitas llenas y vacias
        let bolitas = "";
        for (let n = 0; n < m.max; n++) bolitas += (n < nivel) ? "● " : "○ ";
        pincel.font = "12px " + FUENTE;
        textoConBorde(bolitas.trim(), caja.x + 48, caja.y + 45, "#ffd93d");

        // El precio, a la derecha
        pincel.textAlign = "right";
        pincel.font = "bold 15px " + FUENTE;
        if (alMaximo) {
          textoConBorde("MÁXIMO", caja.x + caja.w - 14, caja.y + 27, "#8ac926");
        } else {
          textoConBorde("🪙 " + precio, caja.x + caja.w - 14, caja.y + 27,
                        puedes ? "#ffd60a" : "#ff8080");
        }
      }

      // ---- La fila de las cestas ----
      pincel.textAlign = "center";
      pincel.textBaseline = "middle";
      pincel.font = "bold 12px " + FUENTE;
      textoConBorde("T U S   C E S T A S", pantalla.width / 2, 372, "#c3d0ea");

      const filaCestasElegida = (filaTienda === MEJORAS.length);

      for (let i = 0; i < CESTAS.length; i++) {
        const cesta  = CESTAS[i];
        const caja   = cajaCesta(i);
        const laTengo = cestasCompradas.indexOf(cesta.clave) >= 0;
        const puesta  = (cestaElegida === cesta.clave);
        const cursor  = filaCestasElegida && (i === cursorCesta);

        // El fondo del cuadradito
        pincel.fillStyle = puesta ? "rgba(126, 224, 129, 0.20)"
                                  : "rgba(8, 12, 30, 0.55)";
        rectRedondeado(caja.x, caja.y, caja.w, caja.h, 11);
        pincel.fill();
        pincel.strokeStyle = puesta ? "#7ee081"
                           : cursor ? "#ffd93d"
                                    : "rgba(255, 255, 255, 0.18)";
        pincel.lineWidth = (puesta || cursor) ? 2.5 : 1.5;
        pincel.stroke();

        // La cesta en miniatura: MISMA funcion que la del juego,
        // solo que le pasamos una jugadora de mentira mas pequena
        pincel.save();
        pincel.globalAlpha = laTengo ? 1 : 0.35;
        dibujarCesta({
          x: caja.x + 9, y: caja.y + 20,
          ancho: 40, alto: 16,
          rebote: 0, inclinacion: 0,
          colores: cesta.colores, viva: true, numero: 0
        });
        pincel.restore();

        // Debajo: el precio, o un check si ya la llevas
        pincel.textAlign = "center";
        pincel.textBaseline = "middle";
        pincel.font = "bold 11px " + FUENTE;
        const cx = caja.x + caja.w / 2;

        if (puesta) {
          textoConBorde("PUESTA", cx, caja.y + 50, "#7ee081");
        } else if (laTengo) {
          textoConBorde("tocar", cx, caja.y + 50, "#c3d0ea");
        } else {
          textoConBorde("🪙" + cesta.precio, cx, caja.y + 50,
                        monedas >= cesta.precio ? "#ffd60a" : "#ff8080");
        }
      }

      // El mensaje de "comprado" o "te faltan monedas"
      if (mensajeTiendaTiempo > 0) {
        pincel.textAlign = "center";
        pincel.textBaseline = "middle";
        pincel.font = "bold 15px " + FUENTE;
        textoConBorde(mensajeTienda, pantalla.width / 2, 470, "#ffffff");
      }

      // Boton de volver
      const b = BOTON_VOLVER;
      pincel.fillStyle = "rgba(8, 12, 30, 0.65)";
      rectRedondeado(b.x, b.y, b.w, b.h, 12);
      pincel.fill();
      pincel.strokeStyle = "rgba(255, 255, 255, 0.35)";
      pincel.lineWidth = 2;
      pincel.stroke();

      pincel.textAlign = "center";
      pincel.textBaseline = "middle";
      pincel.font = "bold 15px " + FUENTE;
      textoConBorde("VOLVER  (T)", b.x + b.w / 2, b.y + b.h / 2);

      pincel.font = "11px " + FUENTE;
      textoConBorde("↑ ↓ elegir  ·  ← → cestas  ·  ESPACIO comprar  ·  o toca",
                    pantalla.width / 2, 546, "#c3d0ea");

      dibujarVinieta();
    }


    // ==========================================
    //  33. DIBUJAR (render)
    // ==========================================

    function dibujar() {
      pincel.clearRect(0, 0, pantalla.width, pantalla.height);

      if (estado === "inicio") { dibujarPantallaInicio(); return; }
      if (estado === "tienda") { dibujarTienda();         return; }
      if (estado === "ayuda")  { dibujarAyuda();          return; }

      dibujarFondo(paletaActual());

      // ---------- EL MUNDO (esto SI tiembla) ----------
      pincel.save();
      if (sacudida > 0) {
        pincel.translate((Math.random() - 0.5) * sacudida,
                         (Math.random() - 0.5) * sacudida);
      }

      dibujarSombras();
      dibujarAuras();
      for (const j of enJuego()) dibujarCesta(j);
      dibujarCosas();

      for (const p of particulas) {
        pincel.globalAlpha = p.vida;
        pincel.fillStyle = p.color;
        circulo(p.x, p.y, p.tamano);
      }
      pincel.globalAlpha = 1;

      pincel.textAlign = "center";
      pincel.textBaseline = "middle";
      pincel.font = "bold 20px " + FUENTE;
      for (const a of avisos) {
        pincel.globalAlpha = a.vida;
        textoConBorde(a.texto, a.x, a.y, a.color);
      }
      pincel.globalAlpha = 1;

      pincel.restore();
      // ---------- FIN DEL MUNDO QUE TIEMBLA ----------

      if (flash > 0) {
        pincel.fillStyle = "rgba(255, 40, 40, " + (flash * 0.38) + ")";
        pincel.fillRect(0, 0, pantalla.width, pantalla.height);
      }

      dibujarVinieta();
      dibujarHUD();

      // ---------- CARTEL DE MUNDO NUEVO ----------
      if (cartelMundo > 0) {
        const m = MUNDOS[mundoActual];

        // Entra y sale desvaneciendose
        let visible = 1;
        if (cartelMundo > 150) visible = (170 - cartelMundo) / 20;
        if (cartelMundo < 40)  visible = cartelMundo / 40;

        pincel.globalAlpha = visible;
        pincel.textAlign = "center";
        pincel.textBaseline = "middle";

        pincel.font = "46px serif";
        pincel.fillStyle = "white";
        pincel.fillText(m.icono, pantalla.width / 2, 205);

        pincel.font = "bold 13px " + FUENTE;
        textoConBorde("NUEVO MUNDO", pantalla.width / 2, 248, "#ffe9a8");
        pincel.font = "bold 28px " + FUENTE;
        textoConBorde(m.nombre, pantalla.width / 2, 280, "#ffd93d");

        pincel.globalAlpha = 1;
      }

      // ---------- AVISO DE MAS VELOCIDAD ----------
      // Va en su propia franja de la pantalla (arriba, sobre y=150) para
      // que pueda salir a la vez que el cartel del mundo sin taparse.
      if (cartelVelocidad > 0 && cartelVelocidad % 22 < 14) {
        pincel.textAlign = "center";
        pincel.textBaseline = "middle";
        pincel.font = "bold 26px " + FUENTE;
        textoConBorde("⚡ ¡MÁS RÁPIDO! ⚡", pantalla.width / 2, 140, "#ffd93d");
        pincel.font = "bold 15px " + FUENTE;
        textoConBorde("velocidad x" + factorVelocidad().toFixed(1),
                      pantalla.width / 2, 168, "#ffe9a8");
      }

      // ---------- AVISO DE BOMBAS ----------
      if (bombasActivadas > 0 && bombasActivadas % 24 < 15 && cartelMundo <= 0) {
        pincel.textAlign = "center";
        pincel.textBaseline = "middle";
        pincel.font = "bold 32px " + FUENTE;
        textoConBorde("¡CUIDADO!", pantalla.width / 2, 350, "#ff5a5a");
        pincel.font = "bold 18px " + FUENTE;
        textoConBorde("Han aparecido bombas 💣", pantalla.width / 2, 384, "#ffc9c9");
        pincel.font = "bold 15px " + FUENTE;
        textoConBorde("¡NO las atrapes, déjalas caer!",
                      pantalla.width / 2, 410, "#ffc9c9");
      }

      // ---------- PAUSA ----------
      if (estado === "pausa") {
        pincel.fillStyle = "rgba(8, 10, 28, 0.78)";
        pincel.fillRect(0, 0, pantalla.width, pantalla.height);

        pincel.textAlign = "center";
        pincel.textBaseline = "middle";

        pincel.font = "bold 44px " + FUENTE;
        textoConBorde("PAUSA", pantalla.width / 2, 232);

        pincel.font = "16px " + FUENTE;
        textoConBorde("Llevas " + puntosLider() + " puntos",
                      pantalla.width / 2, 278, "#d8e6ff");

        // --- Boton SEGUIR ---
        let b = BOTON_SEGUIR;
        pincel.fillStyle = "rgba(126, 224, 129, 0.18)";
        rectRedondeado(b.x, b.y, b.w, b.h, 13);
        pincel.fill();
        pincel.strokeStyle = "rgba(126, 224, 129, 0.8)";
        pincel.lineWidth = 2.5;
        pincel.stroke();
        pincel.font = "bold 18px " + FUENTE;
        textoConBorde("▶  SEGUIR JUGANDO", b.x + b.w / 2, b.y + b.h / 2, "#a8f0aa");

        // --- Boton MENU PRINCIPAL ---
        b = BOTON_ALMENU;
        pincel.fillStyle = "rgba(255, 214, 10, 0.14)";
        rectRedondeado(b.x, b.y, b.w, b.h, 13);
        pincel.fill();
        pincel.strokeStyle = "rgba(255, 214, 10, 0.75)";
        pincel.lineWidth = 2.5;
        pincel.stroke();
        pincel.font = "bold 18px " + FUENTE;
        textoConBorde("🏠  MENÚ PRINCIPAL", b.x + b.w / 2, b.y + b.h / 2, "#ffd60a");

        pincel.font = "12px " + FUENTE;
        textoConBorde("P para seguir   ·   ESC para salir al menú",
                      pantalla.width / 2, 452, "#9fb0d0");
      }

      // ---------- FIN DE PARTIDA ----------
      if (estado === "perdido") {
        pincel.fillStyle = "rgba(0, 0, 0, 0.74)";
        pincel.fillRect(0, 0, pantalla.width, pantalla.height);

        pincel.textAlign = "center";
        pincel.textBaseline = "middle";

        pincel.font = "bold 40px " + FUENTE;
        if (modo === "contrarreloj") {
          textoConBorde("¡TIEMPO!", pantalla.width / 2, 172, "#ffd93d");
        } else {
          textoConBorde("GAME OVER", pantalla.width / 2, 172);
        }

        if (numJugadoras === 2) {
          const p1 = jugadoras[0].puntos;
          const p2 = jugadoras[1].puntos;

          pincel.font = "bold 24px " + FUENTE;
          if (p1 > p2) {
            textoConBorde("🏅 ¡GANA LA JUGADORA 1!", pantalla.width / 2, 226,
                          jugadoras[0].colores.etiqueta);
          } else if (p2 > p1) {
            textoConBorde("🏅 ¡GANA LA JUGADORA 2!", pantalla.width / 2, 226,
                          jugadoras[1].colores.etiqueta);
          } else {
            textoConBorde("🤝 ¡EMPATE!", pantalla.width / 2, 226, "#ffffff");
          }

          pincel.font = "bold 20px " + FUENTE;
          textoConBorde("Jugadora 1:  " + p1, pantalla.width / 2, 272,
                        jugadoras[0].colores.etiqueta);
          textoConBorde("Jugadora 2:  " + p2, pantalla.width / 2, 302,
                        jugadoras[1].colores.etiqueta);

        } else {
          pincel.font = "bold 28px " + FUENTE;
          textoConBorde("Puntuación: " + jugadoras[0].puntos,
                        pantalla.width / 2, 232);
          pincel.font = "13px " + FUENTE;
          textoConBorde("llegaste a " + MUNDOS[mundoActual].icono + " " +
                        MUNDOS[mundoActual].nombre,
                        pantalla.width / 2, 264, "#b9c6e0");
        }

        // Las monedas ganadas
        pincel.font = "bold 17px " + FUENTE;
        textoConBorde("🪙 +" + monedasGanadas + "   (tienes " + monedas + ")",
                      pantalla.width / 2, 344, "#ffd60a");

        if (nuevoRecord) {
          const latido = 1 + Math.sin(reloj / 7) * 0.09;
          pincel.save();
          pincel.translate(pantalla.width / 2, 384);
          pincel.scale(latido, latido);
          pincel.font = "bold 26px " + FUENTE;
          textoConBorde("🏆 ¡NUEVO RÉCORD! 🏆", 0, 0, "#ffd93d");
          pincel.restore();
        } else {
          pincel.font = "bold 20px " + FUENTE;
          textoConBorde("🏆 Récord: " + records[modo],
                        pantalla.width / 2, 384, "#ffd93d");
        }

        if (reloj % 70 < 45) {
          pincel.font = "bold 17px " + FUENTE;
          textoConBorde("PULSA ESPACIO O TOCA AQUÍ", pantalla.width / 2, 432);
        }
      }
    }


    // ==========================================
    //  34. EL BUCLE DE JUEGO (paso fijo)
    // ==========================================

    const PASO = 1000 / 60;

    let tiempoAnterior  = 0;
    let tiempoAcumulado = 0;

    function bucle(ahora) {
      requestAnimationFrame(bucle);

      if (tiempoAnterior === 0) tiempoAnterior = ahora;
      let transcurrido = ahora - tiempoAnterior;
      tiempoAnterior = ahora;

      if (transcurrido > 250) transcurrido = 250;
      tiempoAcumulado += transcurrido;

      let vueltas = 0;
      while (tiempoAcumulado >= PASO && vueltas < 5) {
        reloj++;
        actualizar();
        actualizarEfectos();
        sonarMusica();
        tiempoAcumulado -= PASO;
        vueltas++;
      }

      dibujar();
    }

    requestAnimationFrame(bucle);
  </script>

</body>
</html>
