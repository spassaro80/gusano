    function leerTodo() {
      try {
        const antiguo = Number(localStorage.getItem("recordAtrapaFrutas")) || 0;

        records = {
          clasico:      Number(localStorage.getItem("recordClasico"))      || antiguo,
          contrarreloj: Number(localStorage.getItem("recordContrarreloj")) || 0,
          dos:          Number(localStorage.getItem("recordDos"))          || 0

        // Las mejoras se guardan como TEXTO en formato JSON, porque

        // de vuelta en un objeto de verdad.
        const cestas = localStorage.getItem("cestasCompradas");
        if (cestas) {
          const leidas = JSON.parse(cestas);
          // Solo nos quedamos las claves que existen de verdad hoy
          cestasCompradas = ["mimbre", "azul"];
          for (const c of CESTAS) {
            if (leidas.indexOf(c.clave) >= 0 &&
                cestasCompradas.indexOf(c.clave) < 0) {
              cestasCompradas.push(c.clave);
            }
          }
        }
        const elegida = localStorage.getItem("cestaElegida");
        if (elegida && cestasCompradas.indexOf(elegida) >= 0) {
          cestaElegida = elegida;
        }

        const guardadas = localStorage.getItem("mejoras");
        if (guardadas) {
          const leidas = JSON.parse(guardadas);
          for (const m of MEJORAS) {
            // El "|| 0" protege si un dia anadimos una mejora nueva:
            // las partidas viejas no la tendran guardada.
            mejoras[m.clave] = Number(leidas[m.clave]) || 0;
          }
        }

        // Si algo falla, empezamos de cero y el juego sigue funcionando
      }
    }

    // ==========================================

    let audio = null;

    function despertarAudio() {
      try {
        if (audio === null) {
          audio = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audio.state === "suspended") audio.resume();
      } catch (error) { /* nada */ }
    }

    function sonido(frecuencia, duracion, forma, volumenPropio) {
      const vol = (volumenPropio === undefined) ? AJUSTES.volumen : volumenPropio;
      if (vol <= 0) return;
      try {
        if (audio === null) {
          audio = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audio.state === "suspended") return;

        const oscilador = audio.createOscillator();
        const ganancia  = audio.createGain();
        oscilador.type = forma || "square";
        oscilador.frequency.value = frecuencia;
        ganancia.gain.setValueAtTime(vol, audio.currentTime);
        ganancia.gain.exponentialRampToValueAtTime(0.0001,
                                                   audio.currentTime + duracion);
        oscilador.connect(ganancia);
        ganancia.connect(audio.destination);
        oscilador.start();
        oscilador.stop(audio.currentTime + duracion);
      } catch (error) { /* nada */ }
    }

    // Cada mundo tiene SU cancion, guardada en su propia ficha.
    // Esta funcion no sabe ninguna melodia: solo sabe leer la del
    // mundo en el que estes. En los menus suena la del primer mundo.
    function sonarMusica() {
      if (!AJUSTES.musica) return;
      if (estado !== "jugando" && estado !== "inicio" &&
          estado !== "tienda"  && estado !== "ayuda") return;

      const mundo = (estado === "jugando") ? MUNDOS[mundoActual] : MUNDOS[0];

      if (reloj % mundo.ritmo !== 0) return;

      const nota = mundo.melodia[pasoMelodia % mundo.melodia.length];
      if (nota > 0) sonido(nota, 0.17, "triangle", AJUSTES.volumenMusica);

      // El bajo: una nota grave por cada cuatro de la melodia
      if (pasoMelodia % 4 === 0) {
        const grave = mundo.bajo[Math.floor(pasoMelodia / 4) % mundo.bajo.length];
        if (grave > 0) sonido(grave, 0.42, "sine", AJUSTES.volumenMusica * 1.5);
      }
      pasoMelodia++;
    }

    function dentroDe(caja, x, y) {
      return x > caja.x && x < caja.x + caja.w
          && y > caja.y && y < caja.y + caja.h;
    }

    function cajaFilaTienda(i) {
      return { x: 26, y: 106 + i * 62, w: pantalla.width - 52, h: 54 };
    }

    // Los cuadraditos de las cestas, en una fila
    function cajaCesta(i) {
      const ancho = 58, hueco = 4;
      const total = CESTAS.length * ancho + (CESTAS.length - 1) * hueco;
      const inicio = (pantalla.width - total) / 2;
      return { x: inicio + i * (ancho + hueco), y: 386, w: ancho, h: 62 };
    }


    // ==========================================
    //  12. CONTROLES: TECLADO
    // ==========================================
    const teclas = {};

    document.addEventListener("keydown", function (evento) {
      despertarAudio();
      teclas[evento.key] = true;
      if (evento.key.startsWith("Arrow")) evento.preventDefault();

      // ---- En la tienda ----
      if (estado === "tienda") {
        // Hay MEJORAS.length filas de mejoras, y una fila mas: las cestas
        const filas = MEJORAS.length + 1;

        if (evento.key === "ArrowUp") {
          filaTienda = (filaTienda - 1 + filas) % filas;
          sonidoPausa(520);
        }
        if (evento.key === "ArrowDown") {
          filaTienda = (filaTienda + 1) % filas;
          sonidoPausa(520);
        }
        // En la fila de las cestas, las flechas de los lados eligen cual
        if (filaTienda === MEJORAS.length) {
          if (evento.key === "ArrowLeft") {
            cursorCesta = (cursorCesta - 1 + CESTAS.length) % CESTAS.length;
            sonidoPausa(560);
          }
          if (evento.key === "ArrowRight") {
            cursorCesta = (cursorCesta + 1) % CESTAS.length;
            sonidoPausa(560);
          }
        }
        if (evento.key === " " || evento.key === "Enter") {
          evento.preventDefault();
          if (filaTienda === MEJORAS.length) tocarCesta(cursorCesta);
          else                               comprar(filaTienda);
        }
        if (evento.key === "Escape" || evento.key === "t" || evento.key === "T") {
          estado = "inicio";
          sonidoPausa(330);
        }
        return;      // en la tienda no hacemos nada mas
      }

      // ---- En la pantalla de ayuda ----
      if (estado === "ayuda") {
        if (evento.key === "Escape" || evento.key === " " ||
            evento.key === "h" || evento.key === "H") {
          evento.preventDefault();
          estado = "inicio";
          sonidoPausa(330);
        }
        return;
      }

      // ---- En el menu principal ----
      if (estado === "inicio") {
        if (evento.key === "ArrowLeft")  moverEleccionModo(-1);
        if (evento.key === "ArrowRight") moverEleccionModo( 1);

        if (evento.key === "t" || evento.key === "T") {
          estado = "tienda";
          filaTienda = 0;
          sonidoPausa(660);
          return;
        }
        if (evento.key === "h" || evento.key === "H") {
          estado = "ayuda";
          sonidoPausa(660);
          return;
        }
      }

      if (evento.key === " ") {
        evento.preventDefault();
        if (estado === "inicio" || estado === "perdido") empezarPartida();
      }
      if (evento.key === "p" || evento.key === "P") {
        if (estado === "jugando")    { estado = "pausa";   sonidoPausa(300); }
        else if (estado === "pausa") { estado = "jugando"; sonidoPausa(520); }
      }

      // ESC sale al menu principal desde la partida o desde la pausa
      if (evento.key === "Escape") {
        if (estado === "jugando" || estado === "pausa") volverAlMenu();
      }
      if (evento.key === "m" || evento.key === "M") {
        AJUSTES.musica = !AJUSTES.musica;
        sonidoPausa(AJUSTES.musica ? 660 : 330);
      }
    });

    function moverEleccionModo(direccion) {
      let i = 0;
      for (let k = 0; k < BOTONES_MODO.length; k++) {
        if (BOTONES_MODO[k].modo === modo) i = k;
      }
      i = (i + direccion + BOTONES_MODO.length) % BOTONES_MODO.length;
      modo = BOTONES_MODO[i].modo;
      sonidoPausa(560);

    function puntoEnElLienzo(evento) {
      const caja   = pantalla.getBoundingClientRect();
      const escala = pantalla.width / caja.width;
      return {
        x: (evento.clientX - caja.left) * escala,
        y: (evento.clientY - caja.top)  * escala
      };
    }

    function moverCestaHacia(j, x) {
      j.x = x - j.ancho / 2;
      if (j.x < 0) j.x = 0;
      if (j.x + j.ancho > pantalla.width) j.x = pantalla.width - j.ancho;
    }

    pantalla.addEventListener("pointermove", function (evento) {
      if (estado !== "jugando") return;
      if (evento.pointerType === "mouse" && evento.buttons === 0) return;
      // El dedo controla siempre a la jugadora 1
      moverCestaHacia(jugadoras[0], puntoEnElLienzo(evento).x);
    });

    pantalla.addEventListener("pointerdown", function (evento) {
      evento.preventDefault();
      despertarAudio();

      const p = puntoEnElLienzo(evento);

      if (estado === "inicio") {
        for (const b of BOTONES_MODO) {
          if (dentroDe(b, p.x, p.y)) { modo = b.modo; empezarPartida(); return; }
        }
        if (dentroDe(BOTON_TIENDA, p.x, p.y)) {
          estado = "tienda"; filaTienda = 0; sonidoPausa(660); return;
        }
        if (dentroDe(BOTON_AYUDA, p.x, p.y)) {
          estado = "ayuda"; sonidoPausa(660); return;
        }
        empezarPartida();

      } else if (estado === "tienda") {
        for (let i = 0; i < MEJORAS.length; i++) {
          if (dentroDe(cajaFilaTienda(i), p.x, p.y)) {
            filaTienda = i;
            comprar(i);
            return;
          }
        }
        for (let i = 0; i < CESTAS.length; i++) {
          if (dentroDe(cajaCesta(i), p.x, p.y)) {
            filaTienda = MEJORAS.length;
            cursorCesta = i;
            tocarCesta(i);
            return;
          }
        }
        if (dentroDe(BOTON_VOLVER, p.x, p.y)) {
          estado = "inicio"; sonidoPausa(330);
        }

      } else if (estado === "ayuda") {
        estado = "inicio"; sonidoPausa(330);

      } else if (estado === "perdido") {
        empezarPartida();

      } else if (estado === "pausa") {
        if (dentroDe(BOTON_ALMENU, p.x, p.y)) { volverAlMenu(); return; }
        // Cualquier otro sitio (incluido el boton de seguir) reanuda
        estado = "jugando";
        sonidoPausa(520);

      } else {
        // El botoncito de salir de arriba
        if (dentroDe(BOTON_SALIR, p.x, p.y)) { volverAlMenu(); return; }
        moverCestaHacia(jugadoras[0], p.x);
      }
    });


    // ==========================================
    //  14. LA TIENDA
    // ==========================================

    function precioDe(mejora) {
      const nivel = mejoras[mejora.clave];
      if (nivel >= mejora.max) return null;    // ya esta al maximo
      return mejora.precios[nivel];
    }

    function comprar(indice) {
      const mejora = MEJORAS[indice];
      const precio = precioDe(mejora);

      if (precio === null) {
        mostrarMensajeTienda("¡Ya la tienes al máximo!");
        sonidoNo();
        return;
      }
      if (monedas < precio) {
        mostrarMensajeTienda("Te faltan " + (precio - monedas) + " monedas");
        sonidoNo();
        return;
      }

      monedas -= precio;
      mejoras[mejora.clave]++;
      guardarMonedas();
      guardarMejoras();

      mostrarMensajeTienda("¡" + mejora.nombre + " nivel " +
                           mejoras[mejora.clave] + "!");
      sonidoCompra();
    }

    function mostrarMensajeTienda(texto) {
      mensajeTienda = texto;
      mensajeTiendaTiempo = 150;
    }

    // Las cestas funcionan distinto a las mejoras: una mejora se compra y
    // ya esta. Una cesta se compra Y ADEMAS hay que ponersela.
    function tocarCesta(indice) {
      const cesta = CESTAS[indice];
      const laTengo = cestasCompradas.indexOf(cesta.clave) >= 0;

      if (laTengo) {
        if (cestaElegida === cesta.clave) {
          mostrarMensajeTienda("Ya llevas la cesta " + cesta.nombre);
          sonidoPausa(440);
          return;
        }
        cestaElegida = cesta.clave;
        guardarCestas();
        mostrarMensajeTienda("¡Te has puesto la cesta " + cesta.nombre + "!");
        sonidoPausa(700);
        return;
      }

      if (monedas < cesta.precio) {
        mostrarMensajeTienda("Te faltan " + (cesta.precio - monedas) + " monedas");
        sonidoNo();
        return;
      }

      monedas -= cesta.precio;
      cestasCompradas.push(cesta.clave);
      cestaElegida = cesta.clave;      // al comprarla te la pones ya
      guardarMonedas();
      guardarCestas();
      mostrarMensajeTienda("¡Cesta " + cesta.nombre + " comprada y puesta!");
      sonidoCompra();
    }


    // ==========================================
    //  15. FABRICA DE COSAS QUE CAEN
    // ==========================================

    // Los puntos que mandan: en 2 jugadoras, los de la que va mejor
    function puntosLider() {
      let mejor = 0;
      for (const j of enJuego()) {
        if (j.puntos > mejor) mejor = j.puntos;
      }
      return mejor;
    }

    function bombasPermitidas() {
      const umbral = (modo === "contrarreloj")
                   ? AJUSTES.puntosParaBombasContrarreloj
                   : AJUSTES.puntosParaBombas;
      return puntosLider() >= umbral;
    }

    function alguienNecesitaVida() {
      if (modo === "contrarreloj") return true;   // ahi el corazon da tiempo
      for (const j of enJuego()) {
        if (j.viva && j.vidas < AJUSTES.vidasMaximas) return true;
      }
      return false;
    }

    function elegirTipo() {
      const dado = Math.random();
      let limite = 0;

      if (alguienNecesitaVida()) {
        limite += AJUSTES.probabilidadCorazon;
        if (dado < limite) return "corazon";
      }
      if (bombasPermitidas()) {
        limite += AJUSTES.probabilidadBomba;
        if (dado < limite) return "bomba";
      }
      limite += AJUSTES.probabilidadMoneda;
      if (dado < limite) return "moneda";

      limite += AJUSTES.probabilidadIman;
      if (dado < limite) return "iman";

      limite += AJUSTES.probabilidadEstrella;
      if (dado < limite) return "estrella";

      return "objeto";     // el objeto normal del mundo en el que estes
    }

    // Los premios NUNCA cambian de aspecto, en ningun mundo. Tienes que
    // poder reconocer un peligro en una decima de segundo, sin pensar.
    const PREMIOS = {
      bomba:    { dibujo: { emoji: "💣", forma: "bomba",    color: "#3c3a52" },
                  color: "#ff5a3c", giro: 0.014 },
      estrella: { dibujo: { emoji: "⭐", forma: "estrella", color: "#ffd60a",
                            puntas: 5, gordura: 0.46 },
                  color: "#ffd93d", giro: 0.045 },
      corazon:  { dibujo: { emoji: "💖", forma: "corazon",  color: "#ff5d8f" },
                  color: "#ff8fb1", giro: 0 },
      iman:     { dibujo: { emoji: "🧲", forma: "iman",     color: "#b06bff" },
                  color: "#b06bff", giro: 0.030 },
      moneda:   { dibujo: { emoji: "🪙", forma: "moneda",   color: "#ffc93c" },
                  color: "#ffd60a", giro: 0.060 }
    };

    function crearCosaQueCae() {
      const tipo = elegirTipo();
      let dibujo, color, giro;

      if (PREMIOS[tipo]) {
        dibujo = PREMIOS[tipo].dibujo;
        color  = PREMIOS[tipo].color;      // el color de sus chispas
        giro   = PREMIOS[tipo].giro;
      } else {
        // El objeto normal sale del mundo actual: frutas, conchas,
        // copos, cohetes o caramelos, segun donde estes.
        const lista = MUNDOS[mundoActual].objetos;
        dibujo = lista[Math.floor(Math.random() * lista.length)];
        color  = dibujo.color;
        giro   = (Math.random() - 0.5) * 0.020;
      }

      const xInicial = 34 + Math.random() * (pantalla.width - 68);

      cosas.push({
        xBase: xInicial, x: xInicial, y: -34,
        velocidad: AJUSTES.frutaVelocidadMinima
                 + Math.random() * AJUSTES.frutaVelocidadExtra,
        amplitud: 4 + Math.random() * 7,
        fase: Math.random() * Math.PI * 2,
        angulo: (Math.random() - 0.5) * 0.4,
        giro: giro,
        tipo: tipo, dibujo: dibujo, color: color,
        radio: AJUSTES.frutaRadio,
        fuera: false
      });
    }

    function esBueno(tipo) {
      return tipo !== "bomba";
    }

    function esPremioEspecial(tipo) {
      return tipo === "estrella" || tipo === "corazon"
          || tipo === "iman"     || tipo === "moneda";
    }


    // ==========================================
    //  16. EFECTOS
    // ==========================================

    function crearParticulas(x, y, color, cantidad) {
      for (let i = 0; i < cantidad; i++) {
        const angulo = Math.random() * Math.PI * 2;
        const fuerza = 1 + Math.random() * 3.5;
        particulas.push({
          x: x, y: y,
          vx: Math.cos(angulo) * fuerza,
          vy: Math.sin(angulo) * fuerza - 1.5,
          vida: 1,
          tamano: 1.5 + Math.random() * 3,
          color: color
        });
      }
    }

    function crearAviso(x, y, texto, color) {
      avisos.push({ x: x, y: y, texto: texto, color: color, vida: 1 });
    }

    function actualizarEfectos() {
      if (estado === "pausa") return;

      for (const p of particulas) {
        p.vy += 0.18;  p.x += p.vx;  p.y += p.vy;  p.vida -= 0.022;
      }
      particulas = particulas.filter(function (p) { return p.vida > 0; });

      for (const a of avisos) { a.y -= 1.1;  a.vida -= 0.02; }
      avisos = avisos.filter(function (a) { return a.vida > 0; });

      for (const n of nubes) {
        n.x += n.velocidad;
        if (n.x > pantalla.width + 70) n.x = -70;
      }

      sacudida *= 0.88;   if (sacudida < 0.3) sacudida = 0;
      flash    *= 0.90;   if (flash < 0.01)   flash = 0;

      for (const j of jugadoras) {
        j.rebote *= 0.82;
        if (j.rebote < 0.2) j.rebote = 0;
      }

      if (bombasActivadas > 0) bombasActivadas--;
      if (cartelMundo > 0) cartelMundo--;
      if (cartelVelocidad > 0) cartelVelocidad--;
      if (mensajeTiendaTiempo > 0) mensajeTiendaTiempo--;

      // La transicion entre mundos avanza sola
      if (transicion < 1) {
        transicion += 1 / AJUSTES.pasosDeTransicion;
        if (transicion > 1) transicion = 1;
      }
    }


    // ==========================================
    //  17. COLISIONES
    // ==========================================

    function seTocan(cosa, j) {
      const r = cosa.radio + AJUSTES.generosidad;
      return cosa.x + r > j.x
          && cosa.x - r < j.x + j.ancho
          && cosa.y + r > j.y
          && cosa.y - r < j.y + j.alto;
    }


    // ==========================================
    //  18. EMPEZAR PARTIDA
    // ==========================================

    function empezarPartida() {
      numJugadoras = (modo === "dos") ? 2 : 1;

      cosas = [];  particulas = [];  avisos = [];
      contadorFotogramas = 0;
      tiempoRestante = AJUSTES.segundosContrarreloj * 60;

      // Aqui se aplican las mejoras compradas en la tienda
      const anchoExtra = mejoras.ancho     * 18;
      const velExtra   = mejoras.velocidad * 2;
      const vidasExtra = mejoras.vidas;

      // La jugadora 1 lleva la cesta que hayas elegido en la tienda.
      // La 2 lleva otra distinta, para que no os confundais.
      jugadoras[0].colores = cestaPorClave(cestaElegida).colores;
      jugadoras[1].colores = (cestaElegida === "azul") ? MADERA : MIMBRE_AZUL;

      for (let i = 0; i < jugadoras.length; i++) {
        const j = jugadoras[i];
        j.ancho     = AJUSTES.cestaAncho     + anchoExtra;
        j.velocidad = AJUSTES.cestaVelocidad + velExtra;
        j.alto      = AJUSTES.cestaAlto;
        j.y         = SUELO_Y - j.alto - 1;
        j.puntos = 0;
        j.vidas  = AJUSTES.vidasIniciales + vidasExtra;
        j.viva   = true;
        j.rebote = 0;
        j.inclinacion = 0;
        j.efectoIman = 0;

        // En dos jugadoras empiezan separadas, cada una a un lado
        if (numJugadoras === 2) {
          j.x = (i === 0) ? pantalla.width * 0.25 - j.ancho / 2
                          : pantalla.width * 0.75 - j.ancho / 2;
        } else {
          j.x = (pantalla.width - j.ancho) / 2;
        }
        j.xAnterior = j.x;
      }

      sacudida = 0;  flash = 0;
      bombasActivadas = 0;
      yaAvisadoBombas = false;
      nuevoRecord = false;
      monedasGanadas = 0;
      pasoMelodia = 0;

      mundoActual = 0;  mundoAnterior = 0;  transicion = 1;
      cartelMundo = 0;
      nivelVelocidad = 0;  cartelVelocidad = 0;
      relojDia = 0;        // cada partida empieza de dia

      estado = "jugando";
    }


    // ==========================================
    //  19. TERMINAR PARTIDA
    // ==========================================

    // Reparte lo que has ganado en la partida: monedas y record.
    // Esta parte la necesitan DOS sitios (perder, y salirse al menu),
    // asi que vive en su propia funcion y no repetida en los dos.
    function cobrarPartida() {
      nuevoRecord = false;

      // Las monedas de premio: 1 por cada 10 puntos conseguidos
      let puntosTotales = 0;
      for (const j of enJuego()) puntosTotales += j.puntos;

      monedasGanadas = Math.floor(puntosTotales / AJUSTES.puntosPorMoneda);
      if (monedasGanadas > 0) {
        monedas += monedasGanadas;
        guardarMonedas();
      }

      // El record del modo: la mejor puntuacion individual
      const mejor = puntosLider();
      if (mejor > records[modo]) {
        records[modo] = mejor;
        guardarRecord(modo, mejor);
        nuevoRecord = true;
      }
    }

    function terminarPartida() {
      estado = "perdido";
      cobrarPartida();
      sacudida = 20;
      sonidoGameOver();
    }

    // Salirse al menu principal en mitad de una partida.
    // Cobras igual que si hubieras perdido: no te castigamos por parar.
    function volverAlMenu() {
      if (estado === "jugando" || estado === "pausa") cobrarPartida();

      estado = "inicio";
      cosas = [];  particulas = [];  avisos = [];
      sacudida = 0;  flash = 0;
      bombasActivadas = 0;
      cartelMundo = 0;
      cartelVelocidad = 0;
      pasoMelodia = 0;
      sonidoPausa(300);
    }


    // ==========================================
    //  20. CAMBIAR DE MUNDO
    // ==========================================

    // ==========================================
    //  20b. LA DIFICULTAD
    // ==========================================

    // Cuanto multiplicamos la velocidad de todo lo que cae.
    // Con nivel 0 vale 1, o sea que no cambia nada.
    function factorVelocidad() {
      return 1 + nivelVelocidad * AJUSTES.subidaPorNivel;
    }

    function comprobarVelocidad() {
      const nivel = Math.min(
        Math.floor(puntosLider() / AJUSTES.puntosPorNivel),
        AJUSTES.nivelMaximo
      );

      if (nivel > nivelVelocidad) {
        nivelVelocidad = nivel;
        cartelVelocidad = 130;      // el aviso dura unos 2 segundos
        sacudida = 7;
        sonidoMasRapido();
      }
    }

    function comprobarMundo() {
      const cual = Math.min(
        Math.floor(puntosLider() / AJUSTES.puntosPorMundo),
        MUNDOS.length - 1
      );

      if (cual !== mundoActual) {
        mundoAnterior = mundoActual;
        mundoActual = cual;
        transicion = 0;              // empieza la mezcla suave
        cartelMundo = 170;
        pasoMelodia = 0;             // la cancion nueva empieza por el principio
        sonidoMundoNuevo();

        // Confeti del color del mundo nuevo
        for (const c of MUNDOS[cual].adornos) {
          crearParticulas(pantalla.width / 2, 200, c, 14);
        }
      }
    }


    // ==========================================
    //  21. ACTUALIZAR (update)
    // ==========================================

    function actualizar() {
      if (estado !== "jugando") return;

      relojDia++;      // pasa el tiempo: el sol se mueve

      // --- El reloj del contrarreloj ---
      if (modo === "contrarreloj") {
        tiempoRestante--;
        if (tiempoRestante <= 600 && tiempoRestante > 0
            && tiempoRestante % 60 === 0) sonidoTic();
        if (tiempoRestante <= 0) {
          tiempoRestante = 0;
          terminarPartida();
          return;
        }
      }

      // --- Mover cada jugadora ---
      for (const j of enJuego()) {
        if (j.efectoIman > 0) j.efectoIman--;
        if (!j.viva) continue;

        if (pulsada(j.teclaIzq)) j.x -= j.velocidad;
        if (pulsada(j.teclaDer)) j.x += j.velocidad;

        if (j.x < 0) j.x = 0;
        if (j.x + j.ancho > pantalla.width) j.x = pantalla.width - j.ancho;

        const desplazamiento = j.x - j.xAnterior;
        j.xAnterior = j.x;

        let objetivo = -desplazamiento * 0.015;
        if (objetivo >  0.2) objetivo =  0.2;
        if (objetivo < -0.2) objetivo = -0.2;
        j.inclinacion += (objetivo - j.inclinacion) * 0.22;
      }

      comprobarMundo();
      comprobarVelocidad();

      // --- Aviso de bombas ---
      if (!yaAvisadoBombas && bombasPermitidas()) {
        yaAvisadoBombas = true;
        bombasActivadas = 140;
        sacudida = 10;
        sonido(150, 0.5, "sawtooth");
      }

      // --- Crear cosas ---
      contadorFotogramas++;
      if (contadorFotogramas % AJUSTES.fotogramasEntreFrutas === 0) {
        crearCosaQueCae();
      }

      // Todo lo que cae va multiplicado por el factor del nivel
      const rapidez = factorVelocidad();

      // --- Mover cada cosa ---
      for (const cosa of cosas) {

        cosa.y += cosa.velocidad * rapidez;
        cosa.angulo += cosa.giro;

        // El iman de cada jugadora tira de los premios hacia ELLA
        if (esBueno(cosa.tipo)) {
          for (const j of enJuego()) {
            if (j.efectoIman > 0 && j.viva) {
              const centro = j.x + j.ancho / 2;
              cosa.xBase += (centro - cosa.xBase) * AJUSTES.fuerzaIman;
              if (reloj % 4 === 0) {
                crearParticulas(cosa.x, cosa.y, "#d9b3ff", 1);
              }
            }
          }
        }

        cosa.x = cosa.xBase + Math.sin(reloj / 28 + cosa.fase) * cosa.amplitud;

        // ¿La ha cogido alguna jugadora? La primera que la toque.
        let quien = null;
        for (const j of enJuego()) {
          if (j.viva && seTocan(cosa, j)) { quien = j; break; }
        }

        if (quien !== null) {
          cosa.fuera = true;
          recoger(cosa, quien);

        } else if (cosa.y > SUELO_Y - 4) {
          cosa.fuera = true;
          crearParticulas(cosa.x, SUELO_Y - 2, cosa.color, 9);

          // Solo los objetos normales castigan, y solo en clasico.
          // En 2 jugadoras nadie pierde vida por algo que no cogio nadie:
          // seria injusto castigar a las dos por una sola cosa.
          if (cosa.tipo === "objeto" && modo === "clasico") {
            jugadoras[0].vidas--;
            sacudida = 9;  flash = 0.55;
            sonidoFallo();
          }
        }
      }

      cosas = cosas.filter(function (cosa) { return cosa.fuera === false; });

      // --- ¿Alguien se ha quedado sin vidas? ---
      if (modo !== "contrarreloj") {
        let vivas = 0;
        for (const j of enJuego()) {
          if (j.vidas <= 0) j.viva = false;
          if (j.viva) vivas++;
        }
        if (vivas === 0) terminarPartida();
      }
    }


    // ==========================================
    //  22. RECOGER UNA COSA
    // ==========================================
    // Antes esto era un monton de "else if" dentro de actualizar(). Con
    // dos jugadoras hay que saber SIEMPRE a quien afecta cada cosa, asi
    // que le hemos dado su propia funcion, con la jugadora como parametro.

    function recoger(cosa, j) {

      if (cosa.tipo === "bomba") {
        sacudida = 22;  flash = 1;
        crearParticulas(cosa.x, cosa.y, cosa.color, 26);
        sonidoBomba();

        if (modo === "contrarreloj") {
          tiempoRestante -= AJUSTES.segundosQueQuitaBomba * 60;
          if (tiempoRestante < 0) tiempoRestante = 0;
          crearAviso(cosa.x, cosa.y - 20,
                     "-" + AJUSTES.segundosQueQuitaBomba + "s", "#ff5a3c");
        } else {
          j.vidas--;
          crearAviso(cosa.x, cosa.y - 20, "BOOM!", "#ff5a3c");
        }

      } else if (cosa.tipo === "estrella") {
        j.puntos += AJUSTES.puntosEstrella;
        j.rebote = 9;  sacudida = 5;
        crearParticulas(cosa.x, cosa.y, cosa.color, 24);
        crearAviso(cosa.x, cosa.y - 18, "+" + AJUSTES.puntosEstrella, "#ffd93d");
        sonidoEstrella();

      } else if (cosa.tipo === "corazon") {
        j.rebote = 9;
        crearParticulas(cosa.x, cosa.y, cosa.color, 20);
        sonidoVidaExtra();
        if (modo === "contrarreloj") {
          tiempoRestante += AJUSTES.segundosQueDaCorazon * 60;
          crearAviso(cosa.x, cosa.y - 18,
                     "+" + AJUSTES.segundosQueDaCorazon + "s", "#ff8fb1");
        } else {
          j.vidas = Math.min(j.vidas + 1, AJUSTES.vidasMaximas);
          crearAviso(cosa.x, cosa.y - 18, "+1 VIDA", "#ff8fb1");
        }

      } else if (cosa.tipo === "moneda") {
        monedas++;
        guardarMonedas();
        j.rebote = 6;
        crearParticulas(cosa.x, cosa.y, cosa.color, 16);
        crearAviso(cosa.x, cosa.y - 16, "+1 🪙", "#ffd60a");
        sonidoMoneda();

      } else if (cosa.tipo === "iman") {
        // El iman es SUYO: solo atrae hacia su cesta
        j.efectoIman = AJUSTES.duracionIman + mejoras.iman * 120;
        j.rebote = 9;
        crearParticulas(cosa.x, cosa.y, cosa.color, 24);
        crearAviso(cosa.x, cosa.y - 18, "¡IMÁN!", "#c99bff");
        sonidoIman();

      } else {
        j.puntos++;
        j.rebote = 7;  sacudida = 3;
        crearParticulas(cosa.x, cosa.y, cosa.color, 12);
        crearAviso(cosa.x, cosa.y - 15, "+1", "#ffffff");
        sonidoAtrapar();
      }
    }


    // ==========================================
    //  23. HERRAMIENTAS DE DIBUJO
    // ==========================================

    function mezclarLista(a, b, t) {
      return [ a[0] + (b[0] - a[0]) * t,
               a[1] + (b[1] - a[1]) * t,
               a[2] + (b[2] - a[2]) * t ];
    }

    function entre(a, b, t) { return a + (b - a) * t; }

    function aColor(lista) {
      return "rgb(" + Math.round(lista[0]) + "," +
                      Math.round(lista[1]) + "," +
                      Math.round(lista[2]) + ")";
    }

    function circulo(x, y, radio) {
      pincel.beginPath();
      pincel.arc(x, y, radio, 0, Math.PI * 2);
      pincel.fill();
    }

    function elipse(x, y, radioX, radioY) {
      pincel.beginPath();
      pincel.ellipse(x, y, radioX, radioY, 0, 0, Math.PI * 2);
      pincel.fill();
    }

    function rectRedondeado(x, y, w, h, r) {
      pincel.beginPath();
      pincel.moveTo(x + r, y);
      pincel.lineTo(x + w - r, y);
      pincel.quadraticCurveTo(x + w, y, x + w, y + r);
      pincel.lineTo(x + w, y + h - r);
      pincel.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      pincel.lineTo(x + r, y + h);
      pincel.quadraticCurveTo(x, y + h, x, y + h - r);
      pincel.lineTo(x, y + r);
      pincel.quadraticCurveTo(x, y, x + r, y);
      pincel.closePath();
    }

    function textoConBorde(texto, x, y, colorRelleno) {
      pincel.lineJoin = "round";
      pincel.lineWidth = 5;
      pincel.strokeStyle = "rgba(0, 0, 0, 0.62)";
      pincel.strokeText(texto, x, y);
      pincel.fillStyle = colorRelleno || "white";
      pincel.fillText(texto, x, y);
    }


    // ==========================================
    //  23b. LA LUZ DEL JUEGO
    // ==========================================
    // De UN solo color sacamos su version iluminada y su version en
    // sombra. Asi cada objeto necesita un color y nada mas, y toda la
    // luz del juego viene del mismo sitio: de arriba a la izquierda.

    function hexARgb(hex) {
      return [ parseInt(hex.slice(1, 3), 16),
               parseInt(hex.slice(3, 5), 16),
               parseInt(hex.slice(5, 7), 16) ];
    }

    // cuanto > 0 aclara hacia el blanco; cuanto < 0 oscurece hacia el negro
    function tono(hex, cuanto) {
      const c = hexARgb(hex);
      const destino = (cuanto > 0) ? 255 : 0;
      const k = Math.abs(cuanto);
      return "rgb(" + Math.round(c[0] + (destino - c[0]) * k) + "," +
                      Math.round(c[1] + (destino - c[1]) * k) + "," +
                      Math.round(c[2] + (destino - c[2]) * k) + ")";
    }

    // De donde viene la luz. Cambia estos dos numeros y cambia la
    // iluminacion de TODOS los objetos del juego a la vez.
    const LUZ_X = -0.34;
    const LUZ_Y = -0.42;

    // Un degradado redondo que convierte un color plano en algo con bulto
    function volumen(r, color) {
      const g = pincel.createRadialGradient(r * LUZ_X, r * LUZ_Y, r * 0.10,
                                            0, 0, r * 1.18);
      g.addColorStop(0,    tono(color,  0.58));
      g.addColorStop(0.42, color);
      g.addColorStop(1,    tono(color, -0.40));
      return g;
    }


    // ==========================================
    //  23c. LOS ADORNOS
    // ==========================================
    // Piezas pequenas que se pegan a cualquier forma. Como las pegatinas
    // de un album: pocas piezas, muchisimas combinaciones.

    function adornoTallo(r, color) {
      pincel.strokeStyle = color || "#6b4423";
      pincel.lineWidth = Math.max(1.6, r * 0.13);
      pincel.lineCap = "round";
      pincel.beginPath();
      pincel.moveTo(0, -r * 0.86);
      pincel.quadraticCurveTo(r * 0.10, -r * 1.16, r * 0.02, -r * 1.34);
      pincel.stroke();
      pincel.lineCap = "butt";
    }

    function adornoHoja(r) {
      pincel.save();
      pincel.translate(r * 0.16, -r * 1.12);
      pincel.rotate(-0.55);
      pincel.beginPath();
      pincel.ellipse(r * 0.30, 0, r * 0.34, r * 0.15, 0, 0, Math.PI * 2);
      pincel.fillStyle = volumen(r * 0.4, "#5cb85c");
      pincel.fill();
      pincel.strokeStyle = "#2f6b2f";
      pincel.lineWidth = Math.max(1, r * 0.06);
      pincel.stroke();
      pincel.restore();
    }

    // El reflejo de la luz. Es lo que hace que algo parezca brillante.
    function adornoBrillo(r) {
      pincel.save();
      pincel.translate(r * LUZ_X, r * LUZ_Y);
      pincel.rotate(-0.6);
      pincel.fillStyle = "rgba(255, 255, 255, 0.5)";
      elipse(0, 0, r * 0.30, r * 0.15);
      pincel.restore();
    }

    // --- Texturas (se pintan recortadas dentro de la forma) ---

    function texturaPuntos(o, r) {
      pincel.fillStyle = tono(o.color, -0.30);
      // Posiciones fijas: si usaramos azar, "hervirian" 60 veces por segundo
      const sitios = [[-0.42,-0.30],[0.28,-0.44],[0.46,0.18],[-0.20,0.42],
                      [0.02,-0.06],[-0.52,0.14],[0.20,0.52],[-0.06,0.72]];
      for (const s of sitios) {
        circulo(s[0] * r, s[1] * r, r * 0.10);
      }
    }

    function texturaRayas(o, r) {
      pincel.fillStyle = o.rayas;
      for (let i = -3; i <= 3; i++) {
        pincel.save();
        pincel.rotate(0.35);
        pincel.fillRect(i * r * 0.52 - r * 0.11, -r * 1.4, r * 0.22, r * 2.8);
        pincel.restore();
      }
    }

    function texturaEspiral(o, r) {
      pincel.strokeStyle = o.espiral;
      pincel.lineWidth = r * 0.22;
      pincel.beginPath();
      for (let a = 0; a < Math.PI * 5.2; a += 0.18) {
        const radio = r * 0.10 + (a / (Math.PI * 5.2)) * r * 0.95;
        const px = Math.cos(a) * radio;
        const py = Math.sin(a) * radio;
        if (a === 0) pincel.moveTo(px, py); else pincel.lineTo(px, py);
      }
      pincel.stroke();
    }


    // ==========================================
    //  23d. EL VOCABULARIO DE FORMAS
    // ==========================================
    // Aqui esta el truco para no dibujar 60 objetos a mano: unas pocas
    // FORMAS que se combinan con colores y adornos. Una esfera roja con
    // hoja es una manzana; la misma esfera en naranja y con puntitos es
    // una naranja; en blanco con rayas rojas es un caramelo de menta.
    //
    // Las formas simples solo dicen su "ruta" (su silueta) y el motor se
    // encarga del volumen, la textura y el contorno. Las complicadas se
    // pintan ellas mismas con "pinta".

    const FORMAS = {

      esfera: { ruta: function (r) {
        pincel.beginPath();
        pincel.arc(0, 0, r, 0, Math.PI * 2);
      }},

      ovalo: { ruta: function (r, o) {
        pincel.beginPath();
        pincel.ellipse(0, 0, r * (o.ancho || 0.70), r, 0, 0, Math.PI * 2);
      }},

      // Una pera, o una gota. Con alReves, un caramelo de hielo.
      gota: { ruta: function (r, o) {
        const s = o.alReves ? -1 : 1;
        pincel.beginPath();
        pincel.moveTo(0, -r * s);
        pincel.bezierCurveTo( r * 0.42, -r * 0.80 * s,  r * 0.86, -r * 0.05 * s,
                              r * 0.74,  r * 0.48 * s);
        pincel.bezierCurveTo( r * 0.64,  r * 1.02 * s, -r * 0.64,  r * 1.02 * s,
                             -r * 0.74,  r * 0.48 * s);
        pincel.bezierCurveTo(-r * 0.86, -r * 0.05 * s, -r * 0.42, -r * 0.80 * s,
                              0,        -r * s);
        pincel.closePath();
      }},

      // Un platano: un arco de ida y otro de vuelta, mas pequeno.
      // Lo que queda entre los dos es la media luna.
      medialuna: { pinta: function (o, r) {
        pincel.save();
        pincel.rotate(0.28);

        pincel.beginPath();
        pincel.arc(0, r * 0.62, r * 1.15, Math.PI * 1.18, Math.PI * 1.82);
        pincel.arc(0, r * 0.62, r * 0.62, Math.PI * 1.82, Math.PI * 1.18, true);
        pincel.closePath();

        // La luz cae por el lomo de arriba y la sombra queda por dentro
        const g = pincel.createLinearGradient(0, -r * 0.95, 0, r * 0.25);
        g.addColorStop(0,    tono(o.color,  0.48));
        g.addColorStop(0.55, o.color);
        g.addColorStop(1,    tono(o.color, -0.30));
        pincel.fillStyle = g;
        pincel.fill();

        pincel.strokeStyle = tono(o.color, -0.50);
        pincel.lineWidth = r * 0.085;
        pincel.stroke();

        // Las dos puntitas oscuras del platano
        pincel.fillStyle = tono(o.color, -0.60);
        circulo(-r * 0.75, r * 0.15, r * 0.11);
        circulo( r * 0.75, r * 0.15, r * 0.11);

        pincel.restore();
      }},

      // Una estrella de las puntas que quieras
      estrella: { ruta: function (r, o) {
        const puntas = o.puntas || 5;
        const dentro = r * (o.gordura || 0.46);
        pincel.beginPath();
        for (let i = 0; i < puntas * 2; i++) {
          const radio = (i % 2 === 0) ? r : dentro;
          const a = (i * Math.PI) / puntas - Math.PI / 2;
          const px = Math.cos(a) * radio;
          const py = Math.sin(a) * radio;
          if (i === 0) pincel.moveTo(px, py); else pincel.lineTo(px, py);
        }
        pincel.closePath();
      }},

      corazon: { ruta: function (r) {
        pincel.beginPath();
        pincel.moveTo(0, r * 0.88);
        pincel.bezierCurveTo(-r * 1.30,  r * 0.02, -r * 0.72, -r * 1.06, 0, -r * 0.34);
        pincel.bezierCurveTo( r * 0.72, -r * 1.06,  r * 1.30,  r * 0.02, 0,  r * 0.88);
        pincel.closePath();
      }},

      // Un trozo de sandia
      porcion: { pinta: function (o, r) {
        pincel.save();
        pincel.rotate(-0.25);
        // la corteza
        pincel.beginPath();
        pincel.moveTo(0, r * 0.85);
        pincel.arc(0, r * 0.85, r * 1.55, -Math.PI * 0.78, -Math.PI * 0.22);
        pincel.closePath();
        pincel.fillStyle = volumen(r, o.corteza || "#4f9c36");
        pincel.fill();
        pincel.strokeStyle = tono(o.corteza || "#4f9c36", -0.5);
        pincel.lineWidth = r * 0.09;
        pincel.stroke();
        // la carne
        pincel.beginPath();
        pincel.moveTo(0, r * 0.85);
        pincel.arc(0, r * 0.85, r * 1.24, -Math.PI * 0.76, -Math.PI * 0.24);
        pincel.closePath();
        pincel.fillStyle = volumen(r, o.color);
        pincel.fill();
        // las pipas
        pincel.fillStyle = "#3a2415";
        [[-0.5,-0.22],[0,-0.34],[0.5,-0.22],[-0.26,0.06],[0.26,0.06]].forEach(
          function (s) { elipse(s[0] * r, r * 0.85 + s[1] * r - r * 0.55,
                                r * 0.09, r * 0.13); });
        pincel.restore();
      }},

      // Un racimo: muchas bolitas juntas
      racimo: { pinta: function (o, r) {
        const sitios = [[0,-0.62],[-0.44,-0.20],[0.44,-0.20],[-0.22,0.24],
                        [0.22,0.24],[0,0.70]];
        for (const s of sitios) {
          pincel.beginPath();
          pincel.arc(s[0] * r, s[1] * r, r * 0.40, 0, Math.PI * 2);
          pincel.fillStyle = volumen(r * 0.4, o.color);
          pincel.fill();
          pincel.strokeStyle = tono(o.color, -0.5);
          pincel.lineWidth = r * 0.06;
          pincel.stroke();
        }
        if (o.hoja) adornoHoja(r * 0.8);
      }},

      // Un cubito de hielo, en perspectiva
      cubo: { pinta: function (o, r) {
        const a = r * 0.80;      // media anchura
        const h = r * 0.42;      // la "tapa" en perspectiva
        // la cara de arriba
        pincel.beginPath();
        pincel.moveTo(0, -a - h * 0.5);
        pincel.lineTo(a, -a + h * 0.5);
        pincel.lineTo(0, -a + h * 1.5);
        pincel.lineTo(-a, -a + h * 0.5);
        pincel.closePath();
        pincel.fillStyle = tono(o.color, 0.55);
        pincel.fill();
        // la cara izquierda
        pincel.beginPath();
        pincel.moveTo(-a, -a + h * 0.5);
        pincel.lineTo(0, -a + h * 1.5);
        pincel.lineTo(0, a + h * 0.5);
        pincel.lineTo(-a, a - h * 0.5);
        pincel.closePath();
        pincel.fillStyle = o.color;
        pincel.fill();
        // la cara derecha, en sombra
        pincel.beginPath();
        pincel.moveTo(a, -a + h * 0.5);
        pincel.lineTo(0, -a + h * 1.5);
        pincel.lineTo(0, a + h * 0.5);
        pincel.lineTo(a, a - h * 0.5);
        pincel.closePath();
        pincel.fillStyle = tono(o.color, -0.28);
        pincel.fill();
        // el contorno de toda la silueta
        pincel.beginPath();
        pincel.moveTo(0, -a - h * 0.5);
        pincel.lineTo(a, -a + h * 0.5);
        pincel.lineTo(a, a - h * 0.5);
        pincel.lineTo(0, a + h * 0.5);
        pincel.lineTo(-a, a - h * 0.5);
        pincel.lineTo(-a, -a + h * 0.5);
        pincel.closePath();
        pincel.strokeStyle = tono(o.color, -0.5);
        pincel.lineWidth = r * 0.085;
        pincel.stroke();
        // un destello
        pincel.fillStyle = "rgba(255,255,255,0.55)";
        pincel.fillRect(-a * 0.62, -a * 0.10, a * 0.22, a * 0.85);
      }},

      moneda: { pinta: function (o, r) {
        pincel.beginPath();
        pincel.ellipse(0, 0, r * 0.80, r * 0.96, 0, 0, Math.PI * 2);
        pincel.fillStyle = volumen(r, o.color);
        pincel.fill();
        pincel.strokeStyle = tono(o.color, -0.45);
        pincel.lineWidth = r * 0.10;
        pincel.stroke();
        // el borde interior
        pincel.beginPath();
        pincel.ellipse(0, 0, r * 0.55, r * 0.70, 0, 0, Math.PI * 2);
        pincel.strokeStyle = tono(o.color, -0.28);
        pincel.lineWidth = r * 0.09;
        pincel.stroke();
        // una estrellita en el centro
        pincel.save();
        pincel.scale(0.34, 0.40);
        FORMAS.estrella.ruta(r, { puntas: 5, gordura: 0.45 });
        pincel.fillStyle = tono(o.color, -0.25);
        pincel.fill();
        pincel.restore();
        adornoBrillo(r * 0.9);
      }},

      bomba: { pinta: function (o, r) {
        // la mecha
        pincel.strokeStyle = "#8a7a5a";
        pincel.lineWidth = r * 0.13;
        pincel.lineCap = "round";
        pincel.beginPath();
        pincel.moveTo(r * 0.30, -r * 0.72);
        pincel.quadraticCurveTo(r * 0.86, -r * 1.06, r * 0.66, -r * 1.42);
        pincel.stroke();
        pincel.lineCap = "butt";
        // el cuerpo
        pincel.beginPath();
        pincel.arc(0, r * 0.10, r * 0.86, 0, Math.PI * 2);
        pincel.fillStyle = volumen(r, "#3c3a52");
        pincel.fill();
        pincel.strokeStyle = "#16151f";
        pincel.lineWidth = r * 0.09;
        pincel.stroke();
        // la tapita de arriba
        pincel.fillStyle = "#5a5670";
        pincel.fillRect(-r * 0.24, -r * 0.96, r * 0.48, r * 0.26);
        // la chispa, que late
        const chispa = 0.75 + Math.sin(reloj / 3) * 0.25;
        pincel.save();
        pincel.translate(r * 0.66, -r * 1.44);
        pincel.scale(chispa, chispa);
        FORMAS.estrella.ruta(r * 0.42, { puntas: 6, gordura: 0.30 });
        pincel.fillStyle = "#ffd166";
        pincel.fill();
        FORMAS.estrella.ruta(r * 0.24, { puntas: 6, gordura: 0.30 });
        pincel.fillStyle = "#fff3c4";
        pincel.fill();
        pincel.restore();
        adornoBrillo(r * 0.85);
      }},

      iman: { pinta: function (o, r) {
        pincel.lineCap = "butt";
        // la herradura
        pincel.beginPath();
        pincel.arc(0, r * 0.16, r * 0.72, Math.PI, 0);
        pincel.lineTo(r * 0.72, r * 0.62);
        pincel.lineTo(r * 0.34, r * 0.62);
        pincel.lineTo(r * 0.34, r * 0.16);
        pincel.arc(0, r * 0.16, r * 0.34, 0, Math.PI, true);
        pincel.lineTo(-r * 0.34, r * 0.62);
        pincel.lineTo(-r * 0.72, r * 0.62);
        pincel.closePath();
        const g = pincel.createLinearGradient(-r, 0, r, 0);
        g.addColorStop(0,   tono(o.color,  0.45));
        g.addColorStop(0.5, o.color);
        g.addColorStop(1,   tono(o.color, -0.35));
        pincel.fillStyle = g;
        pincel.fill();
        pincel.strokeStyle = tono(o.color, -0.55);
        pincel.lineWidth = r * 0.085;
        pincel.stroke();
        // las dos puntas: una roja y otra azul
        pincel.fillStyle = "#e63946";
        pincel.fillRect(-r * 0.74, r * 0.44, r * 0.42, r * 0.30);
        pincel.fillStyle = "#457bff";
        pincel.fillRect( r * 0.32, r * 0.44, r * 0.42, r * 0.30);
      }},

      copo: { pinta: function (o, r) {
        pincel.strokeStyle = o.color;
        pincel.lineWidth = r * 0.15;
        pincel.lineCap = "round";
        for (let i = 0; i < 6; i++) {
          pincel.save();
          pincel.rotate((i * Math.PI) / 3);
          pincel.beginPath();
          pincel.moveTo(0, 0);
          pincel.lineTo(0, -r);
          pincel.moveTo(0, -r * 0.60);
          pincel.lineTo( r * 0.30, -r * 0.82);
          pincel.moveTo(0, -r * 0.60);
          pincel.lineTo(-r * 0.30, -r * 0.82);
          pincel.stroke();
          pincel.restore();
        }
        pincel.fillStyle = "#ffffff";
        circulo(0, 0, r * 0.18);
        pincel.lineCap = "butt";
      }},

      cohete: { pinta: function (o, r) {
        // la llama, que tiembla
        const llama = 0.8 + Math.sin(reloj / 2.5) * 0.2;
        pincel.beginPath();
        pincel.moveTo(-r * 0.26, r * 0.86);
        pincel.quadraticCurveTo(0, r * (1.05 + 0.55 * llama), r * 0.26, r * 0.86);
        pincel.closePath();
        pincel.fillStyle = "#ff9f1c";
        pincel.fill();
        // el cuerpo
        pincel.beginPath();
        pincel.moveTo(0, -r * 1.05);
        pincel.quadraticCurveTo( r * 0.52, -r * 0.35,  r * 0.44, r * 0.86);
        pincel.lineTo(-r * 0.44, r * 0.86);
        pincel.quadraticCurveTo(-r * 0.52, -r * 0.35, 0, -r * 1.05);
        pincel.closePath();
        pincel.fillStyle = volumen(r, "#f2f4f8");
        pincel.fill();
        pincel.strokeStyle = "#8d99ae";
        pincel.lineWidth = r * 0.085;
        pincel.stroke();
        // las aletas
        pincel.fillStyle = o.color;
        [-1, 1].forEach(function (lado) {
          pincel.beginPath();
          pincel.moveTo(lado * r * 0.42, r * 0.30);
          pincel.lineTo(lado * r * 0.90, r * 0.90);
          pincel.lineTo(lado * r * 0.42, r * 0.86);
          pincel.closePath();
          pincel.fill();
        });
        // la punta
        pincel.beginPath();
        pincel.moveTo(0, -r * 1.05);
        pincel.quadraticCurveTo( r * 0.34, -r * 0.62, r * 0.30, -r * 0.42);
        pincel.lineTo(-r * 0.30, -r * 0.42);
        pincel.quadraticCurveTo(-r * 0.34, -r * 0.62, 0, -r * 1.05);
        pincel.closePath();
        pincel.fillStyle = o.color;
        pincel.fill();
        // la ventanilla
        pincel.beginPath();
        pincel.arc(0, r * 0.02, r * 0.24, 0, Math.PI * 2);
        pincel.fillStyle = "#8ecae6";
        pincel.fill();
        pincel.strokeStyle = "#4a6fa5";
        pincel.lineWidth = r * 0.08;
        pincel.stroke();
      }},

      nave: { pinta: function (o, r) {
        // la cupula
        pincel.beginPath();
        pincel.arc(0, r * 0.05, r * 0.52, Math.PI, 0);
        pincel.closePath();
        pincel.fillStyle = volumen(r * 0.6, "#a8e6ff");
        pincel.fill();
        pincel.strokeStyle = "#4a89a8";
        pincel.lineWidth = r * 0.08;
        pincel.stroke();
        // el platillo
        pincel.beginPath();
        pincel.ellipse(0, r * 0.16, r, r * 0.34, 0, 0, Math.PI * 2);
        pincel.fillStyle = volumen(r, o.color);
        pincel.fill();
        pincel.strokeStyle = tono(o.color, -0.5);
        pincel.lineWidth = r * 0.085;
        pincel.stroke();
        // las lucecitas, que se encienden por turnos
        for (let i = -2; i <= 2; i++) {
          const encendida = ((Math.floor(reloj / 8) + i + 5) % 5 === 0);
          pincel.fillStyle = encendida ? "#fff3b0" : tono(o.color, -0.35);
          circulo(i * r * 0.34, r * 0.22, r * 0.10);
        }
      }},

      caramelo: { pinta: function (o, r) {
        // los dos picos del envoltorio
        pincel.fillStyle = tono(o.color, 0.30);
        [-1, 1].forEach(function (lado) {
          pincel.beginPath();
          pincel.moveTo(lado * r * 0.44, 0);
          pincel.lineTo(lado * r * 1.10, -r * 0.42);
          pincel.lineTo(lado * r * 1.10,  r * 0.42);
          pincel.closePath();
          pincel.fill();
          pincel.strokeStyle = tono(o.color, -0.40);
          pincel.lineWidth = r * 0.07;
          pincel.stroke();
        });
        // el caramelo
        pincel.beginPath();
        pincel.ellipse(0, 0, r * 0.56, r * 0.62, 0, 0, Math.PI * 2);
        pincel.fillStyle = volumen(r * 0.7, o.color);
        pincel.fill();
        pincel.strokeStyle = tono(o.color, -0.5);
        pincel.lineWidth = r * 0.085;
        pincel.stroke();
        adornoBrillo(r * 0.7);
      }},

      concha: { pinta: function (o, r) {
        pincel.beginPath();
        pincel.moveTo(0, r * 0.86);
        pincel.arc(0, r * 0.86, r * 1.10, -Math.PI * 0.92, -Math.PI * 0.08);
        pincel.closePath();
        pincel.fillStyle = volumen(r, o.color);
        pincel.fill();
        pincel.strokeStyle = tono(o.color, -0.45);
        pincel.lineWidth = r * 0.085;
        pincel.stroke();
        // las nervaduras
        pincel.strokeStyle = tono(o.color, -0.28);
        pincel.lineWidth = r * 0.07;
        for (let i = -2; i <= 2; i++) {
          pincel.beginPath();
          pincel.moveTo(0, r * 0.86);
          pincel.lineTo(i * r * 0.44, r * 0.86 - r * 1.02);
          pincel.stroke();
        }
      }},

      pez: { pinta: function (o, r) {
        // la cola
        pincel.beginPath();
        pincel.moveTo(-r * 0.42, 0);
        pincel.lineTo(-r * 1.05, -r * 0.44);
        pincel.lineTo(-r * 1.05,  r * 0.44);
        pincel.closePath();
        pincel.fillStyle = tono(o.color, -0.20);
        pincel.fill();
        pincel.strokeStyle = tono(o.color, -0.5);
        pincel.lineWidth = r * 0.075;
        pincel.stroke();
        // el cuerpo
        pincel.beginPath();
        pincel.ellipse(r * 0.10, 0, r * 0.68, r * 0.48, 0, 0, Math.PI * 2);
        pincel.fillStyle = volumen(r * 0.8, o.color);
        pincel.fill();
        pincel.strokeStyle = tono(o.color, -0.5);
        pincel.lineWidth = r * 0.085;
        pincel.stroke();
        // el ojo
        pincel.fillStyle = "#ffffff";
        circulo(r * 0.42, -r * 0.12, r * 0.15);
        pincel.fillStyle = "#22212c";
        circulo(r * 0.46, -r * 0.12, r * 0.08);
      }},

      muneco: { pinta: function (o, r) {
        // el cuerpo
        pincel.beginPath();
        pincel.arc(0, r * 0.42, r * 0.60, 0, Math.PI * 2);
        pincel.fillStyle = volumen(r * 0.7, o.color);
        pincel.fill();
        pincel.strokeStyle = "#9db8cc";
        pincel.lineWidth = r * 0.08;
        pincel.stroke();
        // la cabeza
        pincel.beginPath();
        pincel.arc(0, -r * 0.46, r * 0.42, 0, Math.PI * 2);
        pincel.fillStyle = volumen(r * 0.5, o.color);
        pincel.fill();
        pincel.stroke();
        // la cara
        pincel.fillStyle = "#22212c";
        circulo(-r * 0.15, -r * 0.54, r * 0.07);
        circulo( r * 0.15, -r * 0.54, r * 0.07);
        pincel.fillStyle = "#ff8c42";
        pincel.beginPath();
        pincel.moveTo(0, -r * 0.42);
        pincel.lineTo(r * 0.34, -r * 0.34);
        pincel.lineTo(0, -r * 0.28);
        pincel.closePath();
        pincel.fill();
        // los botones
        pincel.fillStyle = "#3c3a52";
        circulo(0, r * 0.24, r * 0.08);
        circulo(0, r * 0.54, r * 0.08);
      }},

      donut: { pinta: function (o, r) {
        // la masa
        pincel.beginPath();
        pincel.arc(0, 0, r * 0.92, 0, Math.PI * 2);
        pincel.arc(0, 0, r * 0.32, 0, Math.PI * 2, true);
        pincel.fillStyle = volumen(r, o.color);
        pincel.fill();
        pincel.strokeStyle = tono(o.color, -0.45);
        pincel.lineWidth = r * 0.085;
        pincel.stroke();
        // el glaseado, con una onda por abajo
        pincel.save();
        pincel.beginPath();
        pincel.arc(0, 0, r * 0.92, 0, Math.PI * 2);
        pincel.arc(0, 0, r * 0.32, 0, Math.PI * 2, true);
        pincel.clip();
        pincel.beginPath();
        pincel.moveTo(-r, -r);
        pincel.lineTo(r, -r);
        pincel.lineTo(r, r * 0.30);
        for (let x = r; x >= -r; x -= r * 0.25) {
          pincel.lineTo(x, r * 0.30 + Math.sin(x / (r * 0.22)) * r * 0.16);
        }
        pincel.closePath();
        pincel.fillStyle = o.glaseado || "#ff9ec7";
        pincel.fill();
        // los fideos de colores
        const fideos = ["#ffffff","#ffd60a","#7ee081","#8ecae6","#ff70a6"];
        const sitios = [[-0.5,-0.5],[0,-0.62],[0.5,-0.48],[-0.62,-0.12],
                        [0.62,-0.14],[-0.24,-0.72],[0.28,-0.20],[-0.12,-0.28]];
        for (let i = 0; i < sitios.length; i++) {
          pincel.save();
          pincel.translate(sitios[i][0] * r, sitios[i][1] * r);
          pincel.rotate(i * 1.1);
          pincel.fillStyle = fideos[i % fideos.length];
          pincel.fillRect(-r * 0.13, -r * 0.05, r * 0.26, r * 0.10);
          pincel.restore();
        }
        pincel.restore();
      }},

      anillado: { pinta: function (o, r) {
        // el anillo de detras
        pincel.save();
        pincel.rotate(-0.35);
        pincel.strokeStyle = tono(o.anillo || "#ffd6a5", -0.25);
        pincel.lineWidth = r * 0.20;
        pincel.beginPath();
        pincel.ellipse(0, 0, r * 1.32, r * 0.36, 0, Math.PI, Math.PI * 2);
        pincel.stroke();
        pincel.restore();
        // el planeta
        pincel.beginPath();
        pincel.arc(0, 0, r * 0.76, 0, Math.PI * 2);
        pincel.fillStyle = volumen(r, o.color);
        pincel.fill();
        pincel.strokeStyle = tono(o.color, -0.5);
        pincel.lineWidth = r * 0.085;
        pincel.stroke();
        // los crateres
        pincel.save();
        pincel.beginPath();
        pincel.arc(0, 0, r * 0.76, 0, Math.PI * 2);
        pincel.clip();
        pincel.fillStyle = tono(o.color, -0.28);
        circulo(-r * 0.26, -r * 0.18, r * 0.16);
        circulo( r * 0.22,  r * 0.24, r * 0.12);
        pincel.restore();
        // el anillo de delante
        pincel.save();
        pincel.rotate(-0.35);
        pincel.strokeStyle = o.anillo || "#ffd6a5";
        pincel.lineWidth = r * 0.20;
        pincel.beginPath();
        pincel.ellipse(0, 0, r * 1.32, r * 0.36, 0, 0, Math.PI);
        pincel.stroke();
        pincel.restore();
        adornoBrillo(r * 0.8);
      }}
    };


    // ==========================================
    //  23e. EL MOTOR DE OBJETOS
    // ==========================================
    // Una sola funcion para dibujar cualquier objeto del juego. Le da
    // volumen, le pega la textura recortada dentro, le pone el contorno
    // y le anade los adornos. Todo con la misma luz.

    function dibujarObjeto(o, r) {
      const forma = FORMAS[o.forma] || FORMAS.esfera;

      // Las formas complicadas se pintan ellas solas
      if (forma.pinta) { forma.pinta(o, r); return; }

      // 1) El cuerpo, con volumen
      forma.ruta(r, o);
      pincel.fillStyle = volumen(r, o.color);
      pincel.fill();

      // 2) La textura, recortada dentro del cuerpo
      if (o.puntos || o.rayas || o.espiral) {
        pincel.save();
        forma.ruta(r, o);
        pincel.clip();
        if (o.puntos)  texturaPuntos(o, r);
        if (o.rayas)   texturaRayas(o, r);
        if (o.espiral) texturaEspiral(o, r);
        pincel.restore();
      }

      // 3) El contorno, del color del objeto pero oscuro
      forma.ruta(r, o);
      pincel.strokeStyle = tono(o.color, -0.52);
      pincel.lineWidth = Math.max(1.2, r * 0.085);
      pincel.stroke();

      // 4) Adornos y reflejo
      if (o.tallo) adornoTallo(r, o.tallo === true ? null : o.tallo);
      if (o.hoja)  adornoHoja(r);
      if (o.brillo !== false) adornoBrillo(r);
    }


    // ==========================================
    //  24. LA PALETA DEL MOMENTO
    // ==========================================
    // Mientras cambias de mundo estas "entre dos mundos": esta funcion
    // mezcla las dos paletas segun lo avanzada que este la transicion.
    // Es la misma idea del dia y la noche, pero con mundos enteros.

    // ¿Cuanto de noche es ahora mismo? 0 = pleno dia, 1 = noche cerrada.
    // Un dia entero dura AJUSTES.pasosPorDia. La PRIMERA mitad es de dia
    // y la segunda va oscureciendo, hace de noche, y vuelve a amanecer.
    function factorNoche() {
      const vuelta = (relojDia % AJUSTES.pasosPorDia) / AJUSTES.pasosPorDia;
      const onda = Math.sin(vuelta * Math.PI * 2);

      // Nos quedamos solo con la parte en la que la onda BAJA.
      // Mientras sube, el resultado es 0: sigue siendo de dia.
      return Math.max(0, -onda);
    }

    function paletaActual() {
      const a = MUNDOS[mundoAnterior];
      const b = MUNDOS[mundoActual];
      const t = transicion;
      const n = factorNoche();

      // Cada color se mezcla DOS veces seguidas:
      //   1) entre los dos mundos (por si estamos cambiando de mundo)
      //   2) hacia el color de la noche
      function color(cual) {
        const deDia = mezclarLista(a[cual], b[cual], t);
        return mezclarLista(deDia, NOCHE, n * AJUSTES.fuerzaDeLaNoche);
      }

      return {
        cieloArriba: color("cieloArriba"),
        cieloAbajo:  color("cieloAbajo"),
        colinaLejos: color("colinaLejos"),
        colinaCerca: color("colinaCerca"),
        suelo:       color("suelo"),
        sueloClaro:  color("sueloClaro"),
        detalle:     color("detalle"),

        // El sol se apaga de noche
        sol:       entre(a.sol, b.sol, t) * (1 - n),
        // Y la luna se enciende
        luna:      n,
        // Las estrellas: las del mundo, o las de la noche, la que gane
        estrellas: Math.max(entre(a.estrellas, b.estrellas, t), n * 0.95),
        planeta:   entre(a.planeta, b.planeta, t),
        nubes:     entre(a.nubes,   b.nubes,   t) * (1 - n * 0.7),
        adornos:   (t < 0.5) ? a.adornos : b.adornos,
        noche:     n
      };
    }

    // El menu usa El Campo oscurecido, para que se lea bien el texto
    function paletaDelMenu() {
      const m = MUNDOS[0];
      const oscuro = [10, 14, 40];
      const t = 0.55;
      return {
        cieloArriba: mezclarLista(m.cieloArriba, oscuro, t),
        cieloAbajo:  mezclarLista(m.cieloAbajo,  oscuro, t),
        colinaLejos: mezclarLista(m.colinaLejos, oscuro, t),
        colinaCerca: mezclarLista(m.colinaCerca, oscuro, t),
        suelo:       mezclarLista(m.suelo,       oscuro, t),
        sueloClaro:  mezclarLista(m.sueloClaro,  oscuro, t),
        detalle:     mezclarLista(m.detalle,     oscuro, t),
        sol: 0, luna: 0.9, estrellas: 0.85, planeta: 0, nubes: 0.25,
        adornos: m.adornos, noche: 0.8
      };
    }


    // ==========================================
    //  25. EL DECORADO
    // ==========================================

    function dibujarFondo(p) {

      const cielo = pincel.createLinearGradient(0, 0, 0, SUELO_Y);
      cielo.addColorStop(0, aColor(p.cieloArriba));
      cielo.addColorStop(1, aColor(p.cieloAbajo));
      pincel.fillStyle = cielo;
      pincel.fillRect(0, 0, pantalla.width, pantalla.height);

      // Estrellas
      if (p.estrellas > 0.02) {
        pincel.fillStyle = "white";
        for (const e of estrellasFondo) {
          const brillo = 0.55 + 0.45 * Math.sin(reloj / 24 + e.fase);
          pincel.globalAlpha = p.estrellas * brillo;
          pincel.fillRect(e.x, e.y, e.tamano, e.tamano);
        }
        pincel.globalAlpha = 1;
      }

      // Sol
      if (p.sol > 0.02) {
        pincel.globalAlpha = p.sol * 0.22;
        pincel.fillStyle = "#ffe9a8";
        circulo(388, 88, 46);
        pincel.globalAlpha = p.sol;
        pincel.fillStyle = "#ffd85e";
        circulo(388, 88, 26);
        pincel.globalAlpha = 1;
      }

      // Un planeta gigante con anillo (solo en Marte)
      if (p.planeta > 0.02) {
        pincel.globalAlpha = p.planeta;
        pincel.fillStyle = "#c1655a";
        circulo(94, 150, 40);
        pincel.fillStyle = "rgba(90, 40, 40, 0.45)";
        circulo(80, 138, 12);
        circulo(106, 165, 8);
        pincel.strokeStyle = "rgba(255, 210, 160, 0.7)";
        pincel.lineWidth = 4;
        pincel.beginPath();
        pincel.ellipse(94, 150, 62, 14, -0.35, 0, Math.PI * 2);
        pincel.stroke();
        pincel.globalAlpha = 1;
      }

      // La luna: sale cuando se hace de noche
      if (p.luna > 0.03) {
        pincel.globalAlpha = p.luna * 0.20;
        pincel.fillStyle = "#f3f0d8";
        circulo(96, 118, 44);                      // el halo
        pincel.globalAlpha = p.luna;
        pincel.fillStyle = "#f6f3dd";
        circulo(96, 118, 23);
        // Un mordisco del color del cielo, para que sea creciente
        pincel.fillStyle = aColor(p.cieloArriba);
        circulo(84, 111, 20);
        pincel.globalAlpha = 1;
      }

      // Nubes: cada mundo dice cuantas tiene, y de noche se ven menos
      const nubosidad = p.nubes;
      if (nubosidad > 0.10) {
        pincel.fillStyle = "#ffffff";
        for (const n of nubes) {
          pincel.globalAlpha = nubosidad * 0.7;
          const s = n.escala;
          circulo(n.x,          n.y,         17 * s);
          circulo(n.x + 21 * s, n.y + 5 * s, 23 * s);
          circulo(n.x + 46 * s, n.y + 1 * s, 15 * s);
          pincel.fillRect(n.x - 17 * s, n.y, 63 * s, 13 * s);
        }
        pincel.globalAlpha = 1;
      }

      // BRUMA: el aire junto al horizonte se ve mas claro. Es lo que
      // hace que las colinas parezcan estar LEJOS de verdad.
      const bruma = pincel.createLinearGradient(0, SUELO_Y - 130, 0, SUELO_Y);
      bruma.addColorStop(0, "rgba(255,255,255,0)");
      bruma.addColorStop(1, "rgba(" + Math.round(p.cieloAbajo[0]) + "," +
                                      Math.round(p.cieloAbajo[1]) + "," +
                                      Math.round(p.cieloAbajo[2]) + ",0.55)");
      pincel.fillStyle = bruma;
      pincel.fillRect(0, SUELO_Y - 130, pantalla.width, 130);

      // Colinas: la de lejos, y encima una capa de bruma sobre ella
      dibujarColinas(SUELO_Y - 62, 26, 120, 0.35, aColor(p.colinaLejos));

      pincel.globalAlpha = 0.28;
      pincel.fillStyle = aColor(p.cieloAbajo);
      pincel.fillRect(0, SUELO_Y - 90, pantalla.width, 90);
      pincel.globalAlpha = 1;

      dibujarColinas(SUELO_Y - 30, 20,  85, 2.10, aColor(p.colinaCerca));

      // LUZ DE CANTO: el borde de arriba de la colina cercana recibe la
      // luz del cielo. Un detalle diminuto que la separa del fondo.
      pincel.save();
      pincel.globalAlpha = 0.5;
      pincel.strokeStyle = aColor(mezclarLista(p.colinaCerca, [255,255,255], 0.45));
      pincel.lineWidth = 2;
      pincel.beginPath();
      for (let x = 0; x <= pantalla.width; x += 6) {
        const yy = (SUELO_Y - 30) + Math.sin(x / 85 + 2.10) * 20;
        if (x === 0) pincel.moveTo(x, yy); else pincel.lineTo(x, yy);
      }
      pincel.stroke();
      pincel.restore();

      // Suelo
      pincel.fillStyle = aColor(p.suelo);
      pincel.fillRect(0, SUELO_Y, pantalla.width, pantalla.height - SUELO_Y);
      pincel.fillStyle = aColor(p.sueloClaro);
      pincel.fillRect(0, SUELO_Y, pantalla.width, 5);

      // Briznas: hierba, arena, nieve, polvo o azucar, segun el mundo
      pincel.strokeStyle = aColor(p.detalle);
      pincel.lineWidth = 2;
      for (const h of hierba) {
        pincel.beginPath();
        pincel.moveTo(h.x, SUELO_Y + 4);
        pincel.lineTo(h.x + h.ladeo, SUELO_Y + 4 - h.alto);
        pincel.stroke();
      }

      // Adornitos del suelo
      for (const a of adornosSuelo) {
        pincel.fillStyle = p.adornos[a.cual];
        circulo(a.x, a.y, 2.4);
      }
    }

    function dibujarColinas(yBase, amplitud, anchura, desfase, color) {
      pincel.fillStyle = color;
      pincel.beginPath();
      pincel.moveTo(0, pantalla.height);
      for (let x = 0; x <= pantalla.width; x += 6) {
        pincel.lineTo(x, yBase + Math.sin(x / anchura + desfase) * amplitud);
      }
      pincel.lineTo(pantalla.width, pantalla.height);
      pincel.closePath();
      pincel.fill();
    }


    // ==========================================
    //  26. SOMBRAS Y AURAS
    // ==========================================

    function dibujarSombras() {
      pincel.fillStyle = "rgba(0, 0, 0, 1)";

      for (const cosa of cosas) {
        let cerca = cosa.y / SUELO_Y;
        if (cerca < 0) cerca = 0;
        if (cerca > 1) cerca = 1;
        pincel.globalAlpha = 0.05 + cerca * 0.25;
        elipse(cosa.x, SUELO_Y + 6, 22 - cerca * 9, 6 - cerca * 2.5);
      }

      for (const j of enJuego()) {
        if (!j.viva) continue;
        pincel.globalAlpha = 0.3;
        elipse(j.x + j.ancho / 2, SUELO_Y + 5, j.ancho * 0.44, 7);
      }
      pincel.globalAlpha = 1;
    }

    function dibujarAuras() {
      for (const j of enJuego()) {
        if (j.efectoIman <= 0 || !j.viva) continue;

        const cx = j.x + j.ancho / 2;
        const cy = j.y + j.alto / 2;

        let intensidad = 1;
        if (j.efectoIman < 60) intensidad = (j.efectoIman % 12 < 7) ? 1 : 0.25;

        pincel.strokeStyle = "#c99bff";
        for (let i = 0; i < 3; i++) {
          const pulso = (reloj / 22 + i / 3) % 1;
          pincel.globalAlpha = (1 - pulso) * 0.5 * intensidad;
          pincel.lineWidth = 3;
          pincel.beginPath();
          pincel.arc(cx, cy, 40 + pulso * 95, 0, Math.PI * 2);
          pincel.stroke();
        }
        pincel.globalAlpha = 1;
      }
    }


    // ==========================================
    //  27. LAS CESTAS
    // ==========================================

    function dibujarCesta(j) {
      const c = j.colores;
      const w = j.ancho;
      const h = j.alto;
      const x = j.x;
      const y = j.y + j.rebote;
      const estrechez = 12;

      pincel.globalAlpha = j.viva ? 1 : 0.3;   // eliminada = tenue

      pincel.save();
      pincel.translate(x + w / 2, y + h / 2);
      pincel.rotate(j.inclinacion);
      pincel.translate(-(x + w / 2), -(y + h / 2));

      // ---- El asa, por detras: dos trazos para darle grosor ----
      pincel.lineCap = "round";
      pincel.strokeStyle = c.bordeOsc;
      pincel.lineWidth = 8;
      pincel.beginPath();
      pincel.arc(x + w / 2, y + 3, w * 0.29, Math.PI * 1.03, Math.PI * 1.97);
      pincel.stroke();
      pincel.strokeStyle = c.asa;
      pincel.lineWidth = 5;
      pincel.beginPath();
      pincel.arc(x + w / 2, y + 3, w * 0.29, Math.PI * 1.03, Math.PI * 1.97);
      pincel.stroke();
      pincel.lineCap = "butt";

      // ---- El cuerpo: un cuenco de lados curvos, no un trapecio ----
      function rutaCuenco() {
        pincel.beginPath();
        pincel.moveTo(x, y);
        pincel.quadraticCurveTo(x + estrechez * 0.2, y + h * 0.72,
                                x + estrechez, y + h - 4);
        pincel.quadraticCurveTo(x + w / 2, y + h + 5,
                                x + w - estrechez, y + h - 4);
        pincel.quadraticCurveTo(x + w - estrechez * 0.2, y + h * 0.72,
                                x + w, y);
        pincel.closePath();
      }

      const madera = pincel.createLinearGradient(x, 0, x + w, 0);
      madera.addColorStop(0,    c.osc);
      madera.addColorStop(0.32, c.cla);
      madera.addColorStop(1,    c.osc);

      rutaCuenco();
      pincel.fillStyle = madera;
      pincel.fill();

      // ---- El mimbre trenzado, recortado dentro del cuenco ----
      pincel.save();
      rutaCuenco();
      pincel.clip();

      pincel.strokeStyle = "rgba(40, 25, 10, 0.28)";
      pincel.lineWidth = 2.5;
      for (let i = 1; i < 4; i++) {
        const yy = y + (h / 4) * i;
        pincel.beginPath();
        pincel.moveTo(x - 8, yy);
        pincel.quadraticCurveTo(x + w / 2, yy + 4, x + w + 8, yy);
        pincel.stroke();
      }
      pincel.lineWidth = 2;
      for (let i = 0; i <= 11; i++) {
        const xx = x + (w / 11) * i;
        pincel.beginPath();
        pincel.moveTo(xx, y);
        pincel.lineTo(xx + (xx - (x + w / 2)) * -0.06, y + h + 6);
        pincel.stroke();
      }

      // La sombra de dentro, junto al borde de arriba
      const dentro = pincel.createLinearGradient(0, y, 0, y + 18);
      dentro.addColorStop(0, "rgba(28, 14, 4, 0.55)");
      dentro.addColorStop(1, "rgba(28, 14, 4, 0)");
      pincel.fillStyle = dentro;
      pincel.fillRect(x - 8, y, w + 16, 18);

      // Un poco de luz rebotando en el fondo del cuenco
      const rebote = pincel.createLinearGradient(0, y + h - 14, 0, y + h + 4);
      rebote.addColorStop(0, "rgba(255, 236, 190, 0)");
      rebote.addColorStop(1, "rgba(255, 236, 190, 0.22)");
      pincel.fillStyle = rebote;
      pincel.fillRect(x - 8, y + h - 14, w + 16, 20);

      pincel.restore();

      // ---- El contorno del cuenco ----
      rutaCuenco();
      pincel.strokeStyle = c.bordeOsc;
      pincel.lineWidth = 2.5;
      pincel.stroke();

      // ---- El borde de arriba ----
      pincel.fillStyle   = c.borde;
      pincel.strokeStyle = c.bordeOsc;
      pincel.lineWidth = 2.5;
      rectRedondeado(x - 5, y - 9, w + 10, 14, 7);
      pincel.fill();
      pincel.stroke();

      // Un brillo fino encima del borde
      pincel.fillStyle = c.brillo;
      rectRedondeado(x - 1, y - 7, w + 2, 3, 1.5);
      pincel.fill();

      pincel.restore();

      // En 2 jugadoras, cada cesta lleva su numero encima
      if (numJugadoras === 2) {
        pincel.textAlign = "center";
        pincel.textBaseline = "middle";
        pincel.font = "bold 15px " + FUENTE;
        textoConBorde(String(j.numero), x + w / 2, y - 22, c.etiqueta);
      }

      pincel.globalAlpha = 1;
    }


    // ==========================================
    //  28. LAS COSAS QUE CAEN
    // ==========================================

    function dibujarCosas() {
      pincel.textAlign = "center";
      pincel.textBaseline = "middle";

      for (const cosa of cosas) {

        pincel.save();
        pincel.translate(cosa.x, cosa.y);

        // Se estira un poquito en la direccion en la que cae. Es el
        // "squash and stretch" de siempre: da sensacion de velocidad.
        const estiron = 1 + cosa.velocidad * 0.028;
        pincel.scale(1 / estiron, estiron);

        pincel.rotate(cosa.angulo);

        if (esPremioEspecial(cosa.tipo)) {
          pincel.shadowColor = cosa.color;
          pincel.shadowBlur  = 16 + Math.sin(reloj / 6) * 6;
        }

        // Con AJUSTES.usarEmojis en true salen los emojis de siempre.
        // Ponlo en false y salen las formas dibujadas a mano.
        if (AJUSTES.usarEmojis && cosa.dibujo.emoji) {
          pincel.font = "36px serif";
          pincel.fillStyle = "white";
          pincel.fillText(cosa.dibujo.emoji, 0, 0);
        } else {
          dibujarObjeto(cosa.dibujo, cosa.radio);
        }

        pincel.shadowBlur = 0;
        pincel.restore();
      }
    }


    // ==========================================
    //  29. CAPAS DE ENCIMA
    // ==========================================

    function dibujarVinieta() {
      const v = pincel.createRadialGradient(
        pantalla.width / 2, pantalla.height / 2, 180,
        pantalla.width / 2, pantalla.height / 2, 420
      );
      v.addColorStop(0, "rgba(0, 0, 0, 0)");
      v.addColorStop(1, "rgba(0, 0, 0, 0.42)");
      pincel.fillStyle = v;
      pincel.fillRect(0, 0, pantalla.width, pantalla.height);
    }


    // ==========================================
    //  30. EL MARCADOR (HUD)
    // ==========================================

    function barraDePoder(x, y, w, h, cuanto, color) {
      pincel.fillStyle = "rgba(0, 0, 0, 0.45)";
      rectRedondeado(x, y, w, h, h / 2);
      pincel.fill();
      if (cuanto > 0) {
        pincel.fillStyle = color;
        rectRedondeado(x + 2, y + 2, (w - 4) * cuanto, h - 4, (h - 4) / 2);
        pincel.fill();
      }
    }

    function panelJugadora(j, x, y, anchoPanel) {
      pincel.fillStyle = "rgba(12, 16, 34, 0.45)";
      rectRedondeado(x, y, anchoPanel, 50, 12);
      pincel.fill();
      pincel.strokeStyle = j.viva ? "rgba(255, 255, 255, 0.2)"
                                  : "rgba(255, 90, 90, 0.55)";
      pincel.lineWidth = 1.5;
      pincel.stroke();

      pincel.textAlign = "left";
      pincel.textBaseline = "top";

      pincel.font = "bold 11px " + FUENTE;
      textoConBorde("JUG. " + j.numero, x + 10, y + 5, j.colores.etiqueta);
      pincel.font = "bold 19px " + FUENTE;
      textoConBorde(String(j.puntos), x + 10, y + 19);

      pincel.font = "12px serif";
      for (let i = 0; i < AJUSTES.vidasMaximas; i++) {
        pincel.globalAlpha = (i < j.vidas) ? 1 : 0.2;
        pincel.fillText(i < j.vidas ? "❤️" : "🖤", x + 55 + i * 14, y + 24);
      }
      pincel.globalAlpha = 1;
    }

        // ---- Panel derecho ----
        if (modo === "clasico") {
          const ancho = 26 * AJUSTES.vidasMaximas + 18;
          pincel.fillStyle = "rgba(12, 16, 34, 0.45)";
          rectRedondeado(pantalla.width - ancho - 10, 10, ancho, 34, 12);
          pincel.fill();
          pincel.strokeStyle = "rgba(255, 255, 255, 0.2)";
          pincel.stroke();

          pincel.textAlign = "left";
          pincel.font = "19px serif";
          for (let i = 0; i < AJUSTES.vidasMaximas; i++) {
            const px = pantalla.width - ancho + 3 + i * 26;
            pincel.globalAlpha = (i < j.vidas) ? 1 : 0.22;
            pincel.fillText(i < j.vidas ? "❤️" : "🖤", px, 17);
          }
          pincel.globalAlpha = 1;

        } else {
          const segundos = tiempoRestante / 60;
          const pocoTiempo = segundos <= 10;
          const latido = pocoTiempo ? (1 + Math.sin(reloj / 5) * 0.06) : 1;

          pincel.save();
          pincel.translate(pantalla.width - 66, 27);
          pincel.scale(latido, latido);
          pincel.translate(-(pantalla.width - 66), -27);

          pincel.fillStyle = pocoTiempo ? "rgba(90, 12, 20, 0.62)"
                                        : "rgba(12, 16, 34, 0.45)";
          rectRedondeado(pantalla.width - 122, 10, 112, 34, 12);
          pincel.fill();
          pincel.strokeStyle = pocoTiempo ? "rgba(255, 120, 120, 0.6)"
                                          : "rgba(255, 255, 255, 0.2)";
          pincel.lineWidth = 1.5;
          pincel.stroke();

          pincel.textAlign = "left";
          pincel.textBaseline = "top";
          pincel.font = "15px serif";
          pincel.fillText("⏱️", pantalla.width - 114, 16);
          pincel.font = "bold 20px " + FUENTE;
          textoConBorde(segundos.toFixed(1) + "s", pantalla.width - 88, 15,
                        pocoTiempo ? "#ff8080" : "#ffffff");
          pincel.restore();

          const total = AJUSTES.segundosContrarreloj * 60;
          pincel.fillStyle = "rgba(0, 0, 0, 0.3)";
          pincel.fillRect(0, 0, pantalla.width, 5);
          pincel.fillStyle = pocoTiempo ? "#ff5a5a" : "#7ee081";
          pincel.fillRect(0, 0,
                          pantalla.width * Math.min(tiempoRestante / total, 1), 5);
        }

        // El nombre del mundo, discreto
        pincel.textAlign = "right";
        pincel.textBaseline = "top";
        pincel.font = "bold 11px " + FUENTE;
        textoConBorde(textoDelMundo(), pantalla.width - 12, 52, "#ffe9a8");
      }

      // ---- Los poderes activos ----
      let filaY = (numJugadoras === 2) ? 90 : 88;

      for (const j of enJuego()) {
        if (j.efectoIman <= 0) continue;
        pincel.textAlign = "left";
        pincel.textBaseline = "middle";
        pincel.font = "15px serif";
        pincel.fillText("🧲", 14, filaY + 6);
        const maximo = AJUSTES.duracionIman + mejoras.iman * 120;
        barraDePoder(36, filaY, 84, 11, j.efectoIman / maximo, "#c99bff");
        if (numJugadoras === 2) {
          pincel.font = "bold 11px " + FUENTE;
          textoConBorde("J" + j.numero, 126, filaY + 6, j.colores.etiqueta);
        }
        filaY += 20;
      }
    }

    function dibujarBotonModo(boton) {
      const elegido = (modo === boton.modo);
      const escala = elegido ? (1.05 + Math.sin(reloj / 18) * 0.015) : 1;

      const cy = boton.y + boton.h / 2;

      pincel.save();
      pincel.translate(cx, cy);
      pincel.scale(escala, escala);
      pincel.translate(-cx, -cy);

      pincel.fillStyle = elegido ? "rgba(255, 217, 61, 0.20)"
                                 : "rgba(8, 12, 30, 0.55)";
      rectRedondeado(boton.x, boton.y, boton.w, boton.h, 13);

      pincel.textBaseline = "middle";

      pincel.font = "20px serif";
      pincel.fillStyle = "white";
      pincel.fillText(boton.icono, cx, boton.y + 18);

      textoConBorde(boton.titulo, cx, boton.y + 41,

      pincel.restore();
